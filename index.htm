</div>

<p>I → am</p>
<p>He / She / It → is</p>
<p>You / We / They → are</p>

<h3>النفي</h3>
<p>I am not</p>
<p>He is not</p>
<p>They are not</p>

<h3>السؤال</h3>
<p>Are you ready?</p>
<p>Is he a teacher?</p>
`,

]
},

/* =========================
   VARIABLES
========================= */

let progress = JSON.parse(localStorage.getItem("a1progress") || "{}");
let mistakes = JSON.parse(localStorage.getItem("a1mistakes") || "[]");

let currentUnit = 0;
let currentQuestion = 0;
let score = 0;
let answered = false;


/* =========================
   SCREEN CONTROL
========================= */

function hideAll(){
  document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
}

function goHome(){
  hideAll();
  document.getElementById("home").classList.remove("hidden");
  renderUnits();
  updateOverall();
}

function showScreen(id){
  hideAll();
  document.getElementById(id).classList.remove("hidden");
}


/* =========================
   UNITS
========================= */

function renderUnits(){

  const box = document.getElementById("units");
  box.innerHTML = "";

  document.getElementById("unitCount").textContent =
    units.length + " وحدة";

  units.forEach((unit,index)=>{

    const div = document.createElement("div");
    div.className = "unit";

    const best = progress[index] || 0;

    div.innerHTML = `
      <div class="unit-title">
        ${index+1}. ${unit.title}
      </div>

      <div class="unit-info">
        ${unit.questions.length} أسئلة
        • أفضل نتيجة: ${best}%
      </div>
    `;

    div.onclick = ()=>openLesson(index);

    box.appendChild(div);
  });
}


/* =========================
   OVERALL PROGRESS
========================= */

function updateOverall(){

  let total = 0;

  units.forEach((_,i)=>{
    if(progress[i] >= 70) total++;
  });

  const percent = Math.round((total / units.length) * 100);

  document.getElementById("overallText").textContent =
    `التقدم: ${percent}% — ${total} من ${units.length} وحدة مجتازة`;

  document.getElementById("overallBar").style.width =
    percent + "%";
}


/* =========================
   LESSON
========================= */

function openLesson(index){

  currentUnit = index;

  document.getElementById("lessonNumber").textContent =
    `الوحدة ${index+1} من ${units.length}`;

  document.getElementById("lessonTitle").textContent =
    units[index].title;

  document.getElementById("lessonContent").innerHTML =
    units[index].explain;

  showScreen("lesson");
}


/* =========================
   QUIZ
========================= */

function startQuiz(){

  currentQuestion = 0;
  score = 0;
  answered = false;

  showScreen("quiz");
  renderQuestion();
}


function renderQuestion(){

  const qs = units[currentUnit].questions;
  const q = qs[currentQuestion];

  answered = false;

  document.getElementById("quizProgress").textContent =
    `السؤال ${currentQuestion+1} من ${qs.length}`;

  document.getElementById("quizBar").style.width =
    ((currentQuestion) / qs.length * 100) + "%";

  document.getElementById("questionText").textContent =
    q[0];

  const options = document.getElementById("options");
  options.innerHTML = "";

  document.getElementById("feedback").innerHTML = "";

  document.getElementById("nextButton").classList.add("hidden");

  const letters = ["A","B","C"];

  for(let i=1;i<=3;i++){

    const btn = document.createElement("button");

    btn.className = "option";

    btn.textContent = `${letters[i-1]}. ${q[i]}`;

    btn.onclick = ()=>answerQuestion(i-1,btn);

    options.appendChild(btn);
  }
}


/* =========================
   ANSWER
========================= */

function answerQuestion(index,button){

  if(answered) return;

  answered = true;

  const q = units[currentUnit].questions[currentQuestion];

  const correctIndex =
    {A:0,B:1,C:2}[q[4]];

  const buttons =
    document.querySelectorAll("#options button");

  buttons.forEach((b,i)=>{

    if(i === correctIndex){
      b.classList.add("correct");
    }

  });

  if(index === correctIndex){

    score++;

    document.getElementById("feedback").innerHTML =
      `<div class="feedback good">✅ إجابة صحيحة</div>`;

  }else{

    button.classList.add("wrong");

    document.getElementById("feedback").innerHTML =
      `<div class="feedback bad">
        ❌ إجابة خاطئة<br>
        الصحيح: ${q[correctIndex+1]}
      </div>`;

    mistakes.push({
      unit:currentUnit,
      question:q[0],
      correct:q[correctIndex+1]
    });

    localStorage.setItem(
      "a1mistakes",
      JSON.stringify(mistakes)
    );
  }

  document.getElementById("nextButton").classList.remove("hidden");
}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

  currentQuestion++;

  if(currentQuestion >= units[currentUnit].questions.length){

    finishQuiz();

  }else{

    renderQuestion();
  }
}


/* =========================
   RESULT
========================= */

function finishQuiz(){

  const total = units[currentUnit].questions.length;

  const percent = Math.round((score / total) * 100);

  const old = progress[currentUnit] || 0;

  if(percent > old){
    progress[currentUnit] = percent;

    localStorage.setItem(
      "a1progress",
      JSON.stringify(progress)
    );
  }

  document.getElementById("score").textContent =
    percent + "%";

  if(percent >= 70){

    document.getElementById("resultText").textContent =
      `ممتاز! اجتزت الوحدة ${currentUnit+1}.`;

  }else{

    document.getElementById("resultText").textContent =
      `تحتاج إلى مراجعة الوحدة. النجاح من 70%.`;
  }

  const nextBtn =
    document.getElementById("nextUnitButton");

  if(currentUnit < units.length-1){

    nextBtn.classList.remove("hidden");
    nextBtn.textContent =
      "الوحدة التالية ➡️";

  }else{

    nextBtn.classList.add("hidden");
  }

  showScreen("result");
}


/* =========================
   NEXT UNIT
========================= */

function nextUnit(){

  if(currentUnit < units.length-1){

    currentUnit++;

    openLesson(currentUnit);
  }
}


/* =========================
   MISTAKES
========================= */

function showMistakes(){

  const box =
    document.getElementById("mistakesList");

  box.innerHTML = "";

  if(mistakes.length === 0){

    box.innerHTML =
      `<p>🎉 لا توجد أخطاء محفوظة.</p>`;

  }else{

    mistakes.slice(-30).reverse().forEach((m)=>{

      const div = document.createElement("div");

      div.className = "example";

      div.innerHTML = `
        <b>السؤال:</b>
        <div>${m.question}</div>
        <br>
        <b>الإجابة الصحيحة:</b>
        <div>${m.correct}</div>
      `;

      box.appendChild(div);
    });
  }

  showScreen("mistakes");
}


/* =========================
   RESET
========================= */

function resetProgress(){

  const ok =
    confirm("هل تريد حذف التقدم والأخطاء بالكامل؟");

  if(!ok) return;

  localStorage.removeItem("a1progress");
  localStorage.removeItem("a1mistakes");

  progress = {};
  mistakes = [];

  renderUnits();
  updateOverall();

  alert("تمت إعادة ضبط البرنامج.");
}


/* =========================
   START
========================= */

renderUnits();
updateOverall();

</script>
