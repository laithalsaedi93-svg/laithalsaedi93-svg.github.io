.question{font-size:19px;font-weight:700;margin:16px 0}

table{border-collapse:collapse;width:100%;margin:8px 0}
td,th{border:1px solid var(--line);padding:8px;text-align:right}
th{background:#eff6ff}
footer{text-align:center;color:var(--muted);padding:20px;font-size:12px}

const STORAGE_KEY = "laithTrainerComplete";
let state = loadState();
let current = null;

let quizQuestions = [];

function freshState(){
  return {version:1,completed:{},scores:{},wrong:[],attempts:0,correct:0,wordsKnown:[],notes:{},writing:{},lastUnit:null};
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const x=JSON.parse(raw);
      return Object.assign(freshState(),x);
    }
  }catch(e){}
  return freshState();
}
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
  catch(e){alert("تعذر حفظ التقدم على هذا الجهاز. استخدم زر النسخة الاحتياطية.");}
}
function $(id){return document.getElementById(id);}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function percent(a,b){return b?Math.round(a/b*100):0;}

function unitCard(u){
  const done=!!state.completed[u.id];
  const score=state.scores[u.id];
  return `<div class="unit">
    <span class="tag">${u.level}</span><span class="tag">${done?"مكتملة":"لم تكتمل بعد"}</span>
    <h3>${esc(u.id)} — ${esc(u.title)}</h3>
    <p>${esc(u.grammar)}${score!==undefined?" — آخر نتيجة: "+score+"%":""}</p>
    <div class="progress"><div style="width:${done?100:(score||0)}%"></div></div>
    <button onclick="openUnit('${u.id}')">فتح الدرس</button>
    <button class="secondary" onclick="startUnitQuiz('${u.id}')">اختبار الوحدة</button>
  </div>`;
}
function getUnit(id){return units.find(u=>u.id===id);}
function openUnit(id){
  const u=getUnit(id);if(!u)return;
  state.lastUnit=id;saveState();
  $("app").innerHTML=`
  <section class="card">
    <span class="tag">${u.level}</span><h2>${esc(u.title)}</h2>
    <h3>شرح الدرس</h3><p>${esc(u.lesson)}</p>
    <h3>القاعدة</h3><ul>${u.rules.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <h3>أمثلة مترجمة</h3><ul>${u.examples.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <h3>مفردات الوحدة</h3>
    <table><thead><tr><th>English</th><th>المعنى بالعربية</th></tr></thead><tbody>${u.words.map(w=>`<tr><td dir="ltr">${esc(w[0])}</td><td>${esc(w[1])}</td></tr>`).join("")}</tbody></table>
    <button onclick="speak('${esc(u.examples[0].split('=')[0].trim()).replace(/'/g,"\\'")}')">استمع إلى مثال</button>
    <button class="green" onclick="startUnitQuiz('${u.id}')">ابدأ اختبار الوحدة</button>
    <button class="secondary" onclick="showHome()">العودة للوحدات</button>
  </section>`;
}
function startUnitQuiz(id){
  const u=getUnit(id);if(!u)return;
  current={id:u.id,name:u.title,isFinal:false};
  quizQuestions=u.quiz.map((q,i)=>({q:q[0],options:q[1],correct:q[2],explanation:q[3],unit:u.id,originalIndex:i}));
  questionIndex=0;answered=false;renderQuestion();
}
function startFinal(){
  current={id:"FINAL",name:"الاختبار النهائي A1 + A2",isFinal:true};
  quizQuestions=shuffle(units.flatMap(u=>u.quiz.map((q,i)=>({q:q[0],options:q[1],correct:q[2],explanation:q[3],unit:u.id,originalIndex:i})))).slice(0,30);
  questionIndex=0;answered=false;renderQuestion();
}
function reviewWrong(){
  const arr=state.wrong.slice();
  if(!arr.length){$("app").innerHTML=`<section class="card"><h2>مراجعة الأخطاء</h2><p>لا توجد أخطاء محفوظة حاليًا. أحسنت!</p><button onclick="showHome()">العودة</button></section>`;return;}
  current={id:"REVIEW",name:"مراجعة الأخطاء",isFinal:false};
  quizQuestions=arr.map(w=>({q:w.q,options:w.options,correct:w.correct,explanation:w.explanation,unit:w.unit,originalIndex:w.originalIndex,reviewKey:w.key}));
  questionIndex=0;answered=false;renderQuestion();
}
function renderQuestion(){
  if(questionIndex>=quizQuestions.length){finishQuiz();return;}
  answered=false;
  const q=quizQuestions[questionIndex];
  $("app").innerHTML=`
  <section class="card">
    <span class="tag">${current.isFinal?"اختبار نهائي":current.id==="REVIEW"?"مراجعة الأخطاء":esc(current.id)}</span>
    <h2>${esc(current.name)}</h2>
    <p class="small">السؤال ${questionIndex+1} من ${quizQuestions.length}</p>
    <div class="progress"><div style="width:${percent(questionIndex,quizQuestions.length)}%"></div></div>
    <div class="question" dir="ltr" style="text-align:left">${esc(q.q)}</div>
    <div id="options">${q.options.map((o,i)=>`<button class="option" dir="ltr" onclick="answerQuestion(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div>
    <div id="feedback"></div>
    <button id="nextBtn" class="green hidden" onclick="nextQuestion()">السؤال التالي</button>
    <button class="secondary" onclick="showHome()">إنهاء والعودة للرئيسية</button>
  </section>`;
}
function answerQuestion(choice){
  if(answered)return;answered=true;
  const q=quizQuestions[questionIndex];
  const buttons=$("options").querySelectorAll("button");
  buttons.forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add("correct");if(i===choice&&choice!==q.correct)b.classList.add("incorrect");});
  state.attempts++;
  const isCorrect=choice===q.correct;
  if(isCorrect){
    state.correct++;
    if(q.reviewKey)state.wrong=state.wrong.filter(w=>w.key!==q.reviewKey);
  }else{
    const key=q.unit+"-"+q.originalIndex+"-"+q.q;
    if(!state.wrong.some(w=>w.key===key)){
      state.wrong.push({key,q:q.q,options:q.options,correct:q.correct,explanation:q.explanation,unit:q.unit,originalIndex:q.originalIndex});
    }
  }
  lastWrong=!isCorrect;saveState();
  $("feedback").innerHTML=`<div class="feedback ${isCorrect?"good":"bad"}"><strong>${isCorrect?"إجابة صحيحة! ✓":"الإجابة غير صحيحة."}</strong><p>${esc(q.explanation)}</p>${!isCorrect?`<p>الإجابة الصحيحة: <b dir="ltr">${esc(q.options[q.correct])}</b></p>`:""}</div>`;
  $("nextBtn").classList.remove("hidden");
}
function nextQuestion(){questionIndex++;renderQuestion();}
function finishQuiz(){
  const id=current.id;
  let message="";
  if(id==="REVIEW"){message="انتهت مراجعة الأخطاء. أعد المحاولة للأسئلة التي بقيت.";}
  else if(id==="FINAL"){message="انتهى الاختبار النهائي. راجع الأخطاء ثم أعد الاختبار لتحسين نتيجتك.";}
  else{
    const total=quizQuestions.length;
    // النتيجة هنا تعتمد على الإجابات الصحيحة في المحاولة الحالية.
    // يحسب الاختبار أدناه بعدد الأسئلة ناقص الأخطاء التي سُجلت أثناء هذه المحاولة.
    const wrongInQuiz=quizQuestions.filter(q=>state.wrong.some(w=>w.key===q.unit+"-"+q.originalIndex+"-"+q.q)).length;
    const score=percent(Math.max(0,total-wrongInQuiz),total);
    state.scores[id]=score;
    if(score>=70)state.completed[id]=true;
    saveState();
    message=`نتيجتك التقريبية: ${score}%. ${score>=70?"أحسنت، تم تسجيل الوحدة كمكتملة.":"أعد الاختبار بعد مراجعة الشرح والأخطاء."}`;
  }
  $("app").innerHTML=`<section class="card"><h2>انتهى الاختبار</h2><p>${esc(message)}</p><p>عدد الأسئلة: ${quizQuestions.length}</p><p>إجمالي الإجابات الصحيحة في سجل التدريب: ${state.correct}</p><p>الأخطاء المحفوظة للمراجعة: ${state.wrong.length}</p><button class="green" onclick="showHome()">الرئيسية</button><button class="secondary" onclick="reviewWrong()">مراجعة الأخطاء</button>${id!=="FINAL"&&id!=="REVIEW"?`<button onclick="startUnitQuiz('${id}')">إعادة الاختبار</button>`:`<button onclick="startFinal()">إعادة الاختبار النهائي</button>`}</section>`;
}

function markWordKnown(word){
  if(!state.wordsKnown.includes(word))state.wordsKnown.push(word);
  saveState();vocabularyIndex++;renderWord();
}
function speak(text){
  if(!("speechSynthesis" in window)){alert("ميزة النطق غير مدعومة في هذا المتصفح.");return;}
  window.speechSynthesis.cancel();
  const msg=new SpeechSynthesisUtterance(text);
  msg.lang="en-US";msg.rate=0.85;
  window.speechSynthesis.speak(msg);
}
function showSkill(skill){
  if(skill==="listening")return listeningModule();
  if(skill==="reading")return readingModule();
  if(skill==="writing")return writingModule();
  if(skill==="speaking")return speakingModule();
  if(skill==="conversation")return conversationModule();
}

 {title:"A Busy Day",text:"My name is Omar. I work in an office in Basra. I usually start work at eight o'clock. Yesterday, I finished work late because I had an important meeting. When I arrived home, I had dinner with my family.",translation:"اسمي عمر. أعمل في مكتب في البصرة. أبدأ العمل عادةً الساعة الثامنة. أمس أنهيت العمل متأخرًا لأن لدي اجتماعًا مهمًا. عندما وصلت إلى المنزل، تناولت العشاء مع عائلتي.",questions:[["Where does Omar work?",["In a school","In an office","In a hospital"],1],["When does he usually start work?",["At eight","At nine","At ten"],0],["Why did he finish late yesterday?",["He had a meeting","He was sick","He missed the bus"],0],["What did he do at home?",["He studied","He slept immediately","He had dinner with his family"],2]]},
 {title:"A Weekend Trip",text:"Last weekend, Sara travelled to a small town with her sister. They stayed in a comfortable hotel near the river. On Saturday, they visited a museum and took many photos. They enjoyed the trip and are planning to return next year.",translation:"في عطلة نهاية الأسبوع الماضية، سافرت سارة إلى بلدة صغيرة مع أختها. أقامتا في فندق مريح قرب النهر. يوم السبت زارتا متحفًا والتقطتا صورًا كثيرة. استمتعتا بالرحلة وتخططان للعودة في العام المقبل.",questions:[["Who travelled with Sara?",["Her friend","Her sister","Her mother"],1],["Where was the hotel?",["Near the river","Near the airport","In the city centre"],0],["What did they visit?",["A hospital","A market","A museum"],2],["When are they planning to return?",["Next week","Next year","Tomorrow"],1]]}
];

function readingModule(){

}
function drawReading(){
  const r=readingItems[readIndex];
  $("app").innerHTML=`<section class="card"><h2>تدريب القراءة</h2><span class="tag">${readIndex+1} / ${readingItems.length}</span><h3 dir="ltr">${esc(r.title)}</h3><p dir="ltr" style="text-align:left;white-space:pre-line">${esc(r.text)}</p><button class="secondary" onclick="$('readTranslation').classList.toggle('hidden')">إظهار / إخفاء الترجمة</button><p id="readTranslation" class="hidden">${esc(r.translation)}</p><hr><h3>أسئلة الفهم</h3>${r.questions.map((q,i)=>`<div class="unit"><p>${i+1}. ${esc(q[0])}</p>${q[1].map((o,j)=>`<button class="option" onclick="checkReading(${i},${j})">${esc(o)}</button>`).join("")}<div id="readF${i}"></div></div>`).join("")}<button class="green" onclick="readIndex=(readIndex+1)%readingItems.length;drawReading()">نص آخر</button><button class="secondary" onclick="showHome()">الرئيسية</button></section>`;

  const q=readingItems[readIndex].questions[qi];
  $("readF"+qi).innerHTML=`<div class="feedback ${oi===q[2]?"good":"bad"}">${oi===q[2]?"إجابة صحيحة!":"الإجابة الصحيحة: "+esc(q[1][q[2]])}</div>`;
}
const writingTasks=[
 {title:"عرّف بنفسك",prompt:"اكتب 4 إلى 6 جمل بالإنجليزية عن اسمك وبلدك وعملك وهواياتك.",sample:"My name is Laith. I live in Basra. I work in an office. I like learning English."},
 {title:"روتينك اليومي",prompt:"اكتب 5 جمل عن يومك مستخدمًا Present Simple.",sample:"I get up at seven. I have breakfast. I go to work. I come home in the afternoon. I study English at night."},
 {title:"ما فعلته أمس",prompt:"اكتب 4 جمل عن يوم أمس باستخدام Past Simple.",sample:"Yesterday, I went to work. I finished at three. I came home. I watched TV."},
 {title:"خططك المستقبلية",prompt:"اكتب 4 جمل عن خططك باستخدام going to أو will.",sample:"I am going to study English. I will practise every day. I am going to read a book."}
];
let writeIndex=0;
function writingModule(){
  writeIndex=0;drawWriting();
}
function drawWriting(){
  const t=writingTasks[writeIndex];
  const saved=state.writing[writeIndex]||"";
  $("app").innerHTML=`<section class="card"><h2>تدريب الكتابة</h2><span class="tag">تمرين ${writeIndex+1} من ${writingTasks.length}</span><h3>${esc(t.title)}</h3><p>${esc(t.prompt)}</p><textarea id="writingAnswer" placeholder="اكتب إجابتك باللغة الإنجليزية...">${esc(saved)}</textarea><button class="green" onclick="saveWriting()">حفظ إجابتي</button><button class="secondary" onclick="$('writingSample').classList.toggle('hidden')">عرض نموذج إجابة</button><div id="writingSample" class="hidden feedback">${esc(t.sample)}</div><p class="small">تلميح: ابدأ بجمل قصيرة، ثم راجع ترتيب الكلمات، والفعل، والحروف الكبيرة والنقطة.</p><button onclick="writeIndex=(writeIndex+1)%writingTasks.length;drawWriting()">تمرين آخر</button><button class="secondary" onclick="showHome()">الرئيسية</button></section>`;
}
function saveWriting(){
  const value=$("writingAnswer").value.trim();
  state.writing[writeIndex]=value;saveState();
  const words=value?value.split(/\s+/).length:0;
  alert("تم حفظ كتابتك. عدد الكلمات: "+words+". هذا البرنامج يحفظ النص لكنه لا يقدم تصحيحًا نحويًا آليًا كاملًا.");
}
const speakingPrompts=[
 "Introduce yourself. (عرّف بنفسك)",
 "Describe your daily routine. (صف روتينك اليومي)",

 "Talk about your plans for next week. (تحدث عن خططك للأسبوع المقبل)",
 "Describe your city. (صف مدينتك)",
 "Talk about your favourite food. (تحدث عن طعامك المفضل)",
 "What have you learned recently? (ماذا تعلمت مؤخرًا؟)"
];
let speakIndex=0;
function speakingModule(){

}

  const p=speakingPrompts[speakIndex];

  $("app").innerHTML=`<section class="card"><h2>تدريب التحدث</h2><p class="small">اقرأ السؤال، ثم أجب بصوتك. يمكنك الاستماع إلى السؤال أو كتابة إجابتك للاحتفاظ بها.</p><h3 dir="ltr" style="text-align:left">${esc(p)}</h3><button onclick="speak(speakingPrompts[speakIndex].split('(')[0])">▶ استمع إلى السؤال</button><textarea id="speakingAnswer" placeholder="اكتب ما قلته أو الإجابة التي تريد التدرب عليها...">${esc(state.notes[key]||"")}</textarea><button class="green" onclick="saveSpeaking()">حفظ الإجابة</button><button onclick="speak($('speakingAnswer').value)">استمع إلى إجابتك</button><button onclick="speakIndex=(speakIndex+1)%speakingPrompts.length;drawSpeaking()">سؤال آخر</button><button class="secondary" onclick="showHome()">الرئيسية</button><p class="small">ملاحظة: هذا القسم لا يسجل صوتك ولا يقيم النطق تلقائيًا؛ استخدمه للتدرب والتحدث بصوت مسموع.</p></section>`;
}
function saveSpeaking(){
  state.notes["speaking-"+speakIndex]=$("speakingAnswer").value;saveState();alert("تم حفظ الإجابة النصية.");

const conversations=[
 {title:"Meeting someone",lines:[["A","Hello! My name is Ali. What's your name?"],["B","Hi, I'm Laith. Nice to meet you."],["A","Nice to meet you too. Where are you from?"],["B","I'm from Basra, Iraq."],["A","What do you do?"],["B","I work for an oil company."]],prompt:"A person asks: Where are you from?"},
 {title:"At a restaurant",lines:[["A","Good evening. Are you ready to order?"],["B","Yes, I'd like chicken and rice, please."],["A","Would you like something to drink?"],["B","Water, please."],["A","Certainly. Anything else?"],["B","No, thank you."]],prompt:"The waiter asks: What would you like to drink?"},
 {title:"At work",lines:[["A","Good morning. Are you free for a meeting?"],["B","Yes. What time does it start?"],["A","It starts at ten o'clock."],["B","That's fine. Where is the meeting?"],["A","In the main office."],["B","Thank you. I'll be there."]],prompt:"Your colleague asks: What time does the meeting start?"},

  $("app").innerHTML=`<section class="card"><h2>المحادثة العملية</h2><span class="tag">${convIndex+1} / ${conversations.length}</span><h3>${esc(c.title)}</h3><p class="small">اضغط على أي جملة للاستماع إليها. اقرأ دور A ثم دور B بصوت مسموع.</p>${c.lines.map((l,i)=>`<div class="unit"><strong>${l[0]==="A"?"المتحدث A":"المتحدث B"}</strong><p dir="ltr" style="text-align:left">${esc(l[1])}</p><button class="secondary" onclick="speak('${l[1].replace(/'/g,"\\'")}')">استمع للجملة</button></div>`).join("")}<hr><h3>دورك الآن</h3><p>${esc(c.prompt)}</p><textarea id="convAnswer" placeholder="اكتب إجابتك، ثم قلها بصوت عالٍ...">${esc(state.notes["conversation-"+convIndex]||"")}</textarea><button class="green" onclick="saveConversation()">حفظ الإجابة</button><button onclick="convIndex=(convIndex+1)%conversations.length;drawConversation()">محادثة أخرى</button><button class="secondary" onclick="showHome()">الرئيسية</button></section>`;
}
function saveConversation(){
  state.notes["conversation-"+convIndex]=$("convAnswer").value;saveState();alert("تم حفظ إجابتك. تدرّب على قولها بصوت مسموع.");
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="laith-english-trainer-backup.json";a.click();
  URL.revokeObjectURL(url);
}
function importBackup(event){
  const file=event.target.files&&event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const parsed=JSON.parse(reader.result);
      if(!parsed||typeof parsed!=="object"||!parsed.completed)throw new Error("invalid");
      state=Object.assign(freshState(),parsed);saveState();showHome();alert("تم استرجاع التقدم بنجاح.");
    }catch(e){alert("الملف غير صالح أو ليس نسخة احتياطية من البرنامج.");}
  };
  reader.readAsText(file);
}
function resetProgress(){
  if(!confirm("هل تريد تصفير التقدم والنتائج والأخطاء المحفوظة؟ لا يمكن التراجع بعد ذلك."))return;
  state=freshState();saveState();showHome();
}
