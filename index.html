<style>

<body>

<header>
  <h1>English Trainer A1 → A2 | Laith</h1>

<div class="container">

    </button>

    </button>

  </div>

</div>

    </button>
  </div>

  </div>

</div>

</div>


<script>

const units = [

{
title:"الوحدة 1 — Verb to be",
explain:`
<h3>📌 الفكرة</h3>

<p>
نستخدم <b>am / is / are</b> مع فعل to be.
</p>

<ul>
<li>I → am</li>
<li>He / She / It → is</li>
<li>You / We / They → are</li>
</ul>

<h3>✅ الإثبات</h3>

<div class="example">
<div class="en">I am a student.</div>
<div class="ar">أنا طالب.</div>
</div>

<div class="example">
<div class="en">She is happy.</div>
<div class="ar">هي سعيدة.</div>
</div>

<div class="example">
<div class="en">They are ready.</div>
<div class="ar">هم مستعدون.</div>
</div>

<h3>❌ النفي</h3>

<div class="example">
<div class="en">I am not tired.</div>
<div class="ar">أنا لست متعبًا.</div>
</div>

<div class="example">
<div class="en">He is not here.</div>
<div class="ar">هو ليس هنا.</div>
</div>

<h3>❓ السؤال</h3>

<div class="example">
<div class="en">Are you ready?</div>
<div class="ar">هل أنت مستعد؟</div>
</div>

<div class="example">
<div class="en">Is she a teacher?</div>
<div class="ar">هل هي معلمة؟</div>
</div>
`,

["I ___ a student.","am","is","are","A"],
["She ___ happy.","am","is","are","B"],
["They ___ ready.","am","is","are","C"],
["We ___ friends.","am","is","are","C"],
["He ___ at home.","am","is","are","B"],
["You ___ my friend.","am","is","are","C"],
["It ___ cold.","am","is","are","B"],
["I ___ not tired.","am","is","are","A"]
]
},

{
title:"الوحدة 2 — Pronouns",
explain:`
<h3>📌 الضمائر</h3>
<ul>
<li>I = أنا</li>
<li>You = أنت / أنتم</li>
<li>He = هو</li>
<li>She = هي</li>
<li>It = هو/هي لغير العاقل</li>
<li>We = نحن</li>

</div>

<div class="example">

</div>
`,

["Ali is a boy. ___ is young.","He","She","They","A"],
["Sara is a girl. ___ is happy.","He","She","It","B"],
["The dog is small. ___ is cute.","He","She","It","C"],
["Ali and Omar are friends. ___ are happy.","He","They","It","B"],
["My brother and I are students. ___ are students.","We","They","He","A"],
["___ am from Iraq.","I","He","They","A"]
]
},

{
title:"الوحدة 3 — Possessives",
explain:`
<h3>📌 الملكية</h3>

<ul>
<li>my = لي / خاصتي</li>
<li>your = لك</li>
<li>his = له</li>
<li>her = لها</li>
<li>our = لنا</li>
<li>their = لهم</li>
</ul>

<div class="example">
<div class="en">This is my car.</div>
<div class="ar">هذه سيارتي.</div>
</div>

<div class="example">
<div class="en">That is her phone.</div>
<div class="ar">ذلك هاتفها.</div>
</div>

<p>
نستخدم <b>'s</b> للدلالة على الملكية:
</p>

<div class="example">
<div class="en">Ali's car</div>
<div class="ar">سيارة علي</div>
</div>
`,
questions:[
["This is ___ book.","I","my","me","B"],
["That is ___ car.","he","his","him","B"],
["This is ___ phone.","she","her","hers","B"],
["This is ___ house.","we","our","us","B"],
["That is ___ school.","they","their","them","B"],
["Ali's car means:","سيارة علي","علي سيارة","سيارة إلى علي","A"]
]
},

{
title:"الوحدة 4 — Articles a / an / the",
explain:`
<h3>📌 أدوات التعريف</h3>

<p>
<b>a</b> قبل الاسم المفرد الذي يبدأ بصوت ساكن.
</p>

<div class="example">
<div class="en">a car</div>
<div class="ar">سيارة</div>
</div>

<p>
<b>an</b> قبل الاسم المفرد الذي يبدأ بصوت علّة.
</p>

<div class="example">
<div class="en">an apple</div>
<div class="ar">تفاحة</div>
</div>

<p>
<b>the</b> عندما نتحدث عن شيء محدد ومعروف.
</p>

<div class="example">
<div class="en">The car is red.</div>
<div class="ar">السيارة حمراء.</div>
</div>
`,
questions:[
["I have ___ car.","a","an","the","A"],
["She has ___ apple.","a","an","the","B"],
["He is ___ teacher.","a","an","the","A"],
["___ sun is hot.","A","An","The","C"],
["I saw ___ dog.","a","an","the","A"]
]
},

{
title:"الوحدة 5 — This / That / These / Those",
explain:`
<h3>📌 أسماء الإشارة</h3>

<ul>
<li>This = هذا / هذه — مفرد قريب</li>
<li>That = ذلك / تلك — مفرد بعيد</li>
<li>These = هؤلاء / هذه الأشياء — جمع قريب</li>
<li>Those = أولئك / تلك الأشياء — جمع بعيد</li>
</ul>

<div class="example">
<div class="en">This is my phone.</div>
<div class="ar">هذا هاتفي.</div>
</div>

<div class="example">
<div class="en">Those are my shoes.</div>
<div class="ar">تلك أحذيتي.</div>
</div>
`,
questions:[
["___ is my book.","This","These","Those","A"],
["___ are my shoes.","This","That","These","C"],
["___ is your car over there.","This","That","These","B"],
["___ are the houses over there.","This","These","Those","C"],
["___ is a pen.","This","These","Those","A"]
]
},

{
title:"الوحدة 6 — Singular / Plural",
explain:`
<h3>📌 المفرد والجمع</h3>

<p>
غالبًا نضيف <b>s</b> للجمع:
</p>

<div class="example">
<div class="en">book → books</div>
<div class="ar">كتاب → كتب</div>
</div>

<div class="example">
<div class="en">car → cars</div>
<div class="ar">سيارة → سيارات</div>
</div>

<p>
وهناك جموع شاذة:
</p>

<ul>
<li>man → men</li>
<li>woman → women</li>
<li>child → children</li>
<li>person → people</li>
</ul>
`,

["One man, two ___.","mans","men","mens","B"],
["One woman, two ___.","woman","women","womans","B"]
]
},

{
title:"الوحدة 7 — Present Simple",
explain:`
<h3>📌 المضارع البسيط</h3>

<p>
نستخدمه للعادات والحقائق والأشياء التي تحدث بشكل متكرر.
</p>

<div class="example">
<div class="en">I work every day.</div>
<div class="ar">أنا أعمل كل يوم.</div>
</div>

<div class="example">
<div class="en">She works every day.</div>
<div class="ar">هي تعمل كل يوم.</div>
</div>

<p>
مع <b>he / she / it</b> نضيف غالبًا <b>s</b>.
</p>

<div class="example">
<div class="en">He plays football.</div>
<div class="ar">هو يلعب كرة القدم.</div>
</div>
`,
questions:[
["I ___ every day.","work","works","working","A"],
["She ___ English.","study","studies","studying","B"],
["He ___ football.","play","plays","playing","B"],
["They ___ coffee.","drink","drinks","drinking","A"],
["My father ___ at night.","work","works","working","B"],
["We ___ English.","learn","learns","learning","A"],
["The car ___ fast.","go","goes","going","B"]
]
},

{
title:"الوحدة 8 — Do / Does + Negatives",
explain:`
<h3>📌 النفي والسؤال</h3>

<p>
نستخدم <b>do</b> مع:
I / you / we / they
</p>

<p>
ونستخدم <b>does</b> مع:
he / she / it
</p>

<div class="ar">هل تعمل؟</div>
</div>

<div class="example">

<div class="ar">هل هو يعمل؟</div>
</div>

<div class="example">
<div class="en">I don't work.</div>
<div class="ar">أنا لا أعمل.</div>
</div>

<div class="example">
<div class="en">She doesn't work.</div>
<div class="ar">هي لا تعمل.</div>
</div>
`,
questions:[
["___ you work?","Do","Does","Is","A"],
["___ he work?","Do","Does","Are","B"],
["I ___ like tea.","don't","doesn't","not","A"],
["She ___ like coffee.","don't","doesn't","isn't","B"],
["___ they live here?","Do","Does","Are","A"],
["___ she speak English?","Do","Does","Is","B"]
]
},

{
title:"الوحدة 9 — WH Questions",
explain:`
<h3>📌 كلمات السؤال</h3>

<ul>
<li>What = ماذا / ما</li>
<li>Where = أين</li>
<li>When = متى</li>
<li>Who = من</li>
<li>Why = لماذا</li>
<li>How = كيف</li>
<li>How old = كم العمر</li>

</ul>

<div class="example">

<div class="ar">أين تعيش؟</div>
</div>

<div class="example">
<div class="en">What do you do?</div>
<div class="ar">ماذا تعمل؟</div>
</div>

<div class="example">
<div class="en">Why are you tired?</div>
<div class="ar">لماذا أنت متعب؟</div>
</div>
`,
questions:[
["___ do you live?","What","Where","When","B"],
["___ is your name?","What","Where","Why","A"],
["___ do you go to work?","When","Who","What","A"],
["___ is your teacher?","Who","Where","Why","A"],
["___ are you tired?","What","Why","Where","B"],
["___ old are you?","What","How","Where","B"],
["___ books do you have?","How much","How many","How old","B"]
]
},

{
title:"الوحدة 10 — Frequency Adverbs",
explain:`
<h3>📌 ظروف التكرار</h3>

<div class="ar">أنا دائمًا أشرب القهوة.</div>
</div>

<div class="example">

`,
questions:[
["I ___ go to work every day.","always","never","sometimes","A"],
["She ___ drinks coffee, but not every day.","sometimes","never","always","A"],
["He ___ arrives on time.","usually","never","not","A"],
["I ___ smoke.","never","always","usually","A"],
["They ___ play football on Fridays.","often","never","not","A"]
]
},

{
title:"الوحدة 11 — Present Continuous",
explain:`

<p>
نستخدمه لشيء يحدث الآن.
</p>

<p>
التركيب:
</p>

<p>
<b>am / is / are + verb-ing</b>
</p>

<div class="ar">أنا أعمل الآن.</div>
</div>

<div class="example">

</div>

<div class="example">
<div class="en">They are playing.</div>
<div class="ar">هم يلعبون الآن.</div>
</div>
`,
questions:[
["I ___ working now.","am","is","are","A"],
["She ___ sleeping.","am","is","are","B"],
["They ___ playing.","am","is","are","C"],
["We ___ studying.","am","is","are","C"],
["He ___ driving.","am","is","are","B"],
["You ___ reading.","am","is","are","C"]
]
},

{
title:"الوحدة 12 — Prepositions",
explain:`
<h3>📌 حروف الجر</h3>

questions:[

["The car is ___ the garage.","in","on","at","A"],

{

{

let progress = JSON.parse(localStorage.getItem("a1progress") || "{}");
let mistakes = JSON.parse(localStorage.getItem("a1mistakes") || "[]");

let currentUnit = 0;
let currentQuestion = 0;
let score = 0;
let quizQuestions = [];

function save(){
  localStorage.setItem("a1progress",JSON.stringify(progress));
  localStorage.setItem("a1mistakes",JSON.stringify(mistakes));
}

function renderUnits(){

  const box=document.getElementById("units");
  box.innerHTML="";

  units.forEach((u,i)=>{

    let p=progress[i] || 0;

    box.innerHTML += `
      <div class="unit">
        <div class="unit-title">${i+1}. ${u.title}</div>

        <span class="badge">
          ${p >= 70 ? "✅ مكتملة" : p > 0 ? "🔄 قيد الدراسة" : "⭕ لم تبدأ"}
        </span>

        <p class="small">الإتقان: ${p}%</p>

        <div class="progress">
          <div class="progress-bar" style="width:${p}%"></div>
        </div>

        <button class="primary" onclick="openUnit(${i})">
          فتح الوحدة
        </button>
      </div>
    `;
  });

  updateOverall();
}

function updateOverall(){

  let total=0;

  for(let i=0;i<units.length;i++){
    total += progress[i] || 0;
  }

  let overall=Math.round(total/units.length);

  document.getElementById("overallProgress").style.width=overall+"%";

  document.getElementById("overallText").innerText =
    `التقدم العام في A1: ${overall}% — ${units.length} وحدة`;
}

function hideAll(){

  document.getElementById("home").classList.add("hidden");
  document.getElementById("lesson").classList.add("hidden");
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("mistakes").classList.add("hidden");

}

function goHome(){

  hideAll();
  document.getElementById("home").classList.remove("hidden");
  renderUnits();

}

function openUnit(i){

  currentUnit=i;

  hideAll();

  document.getElementById("lesson").classList.remove("hidden");

  document.getElementById("lessonTitle").innerText =
    units[i].title;

  document.getElementById("lessonContent").innerHTML =
    units[i].explain;
}

function startQuiz(){

  currentQuestion=0;
  score=0;

  quizQuestions=[...units[currentUnit].questions];

  hideAll();

  document.getElementById("quiz").classList.remove("hidden");

  document.getElementById("quizTitle").innerText =
    units[currentUnit].title;

  showQuestion();
}

function showQuestion(){

  const q=quizQuestions[currentQuestion];

  document.getElementById("questionNumber").innerText =
    `السؤال ${currentQuestion+1} من ${quizQuestions.length}`;

  document.getElementById("questionText").innerText=q[0];

  const options=document.getElementById("options");

  options.innerHTML="";

  document.getElementById("feedback").innerHTML="";

  for(let i=1;i<=3;i++){

    const btn=document.createElement("button");

    btn.className="option";

    btn.innerText=q[i];

    btn.onclick=()=>answer(i-1,btn);

    options.appendChild(btn);
  }
}

function answer(index,button){

  const q=quizQuestions[currentQuestion];

  const correct =
    q[4]==="A" ? 0 :
    q[4]==="B" ? 1 : 2;

  const buttons=document.querySelectorAll(".option");

  buttons.forEach(b=>b.disabled=true);

  if(index===correct){

    button.classList.add("correct");

    score++;

    document.getElementById("feedback").innerHTML=
      `<div class="example">✅ إجابة صحيحة!</div>`;

  }else{

    button.classList.add("wrong");

    buttons[correct].classList.add("correct");

    document.getElementById("feedback").innerHTML=
      `<div class="example">
        ❌ غير صحيحة.<br>
        الإجابة الصحيحة: <b>${q[correct+1]}</b>
      </div>`;

    mistakes.push({
      unit:currentUnit,
      question:q[0],
      answer:q[correct+1]
    });

    save();
  }

  setTimeout(()=>{

    currentQuestion++;

    if(currentQuestion < quizQuestions.length){

      showQuestion();

    }else{

      finishQuiz();

    }

  },1100);
}

function finishQuiz(){

  let percent=
    Math.round((score/quizQuestions.length)*100);

  progress[currentUnit]=Math.max(
    progress[currentUnit] || 0,
    percent
  );

  save();

  hideAll();

  document.getElementById("result").classList.remove("hidden");

  let message="";

  if(percent>=90){
    message="🏆 ممتاز جدًا! أنت متقن لهذه الوحدة.";
  }else if(percent>=70){
    message="✅ جيد جدًا! الوحدة ناجحة ويمكنك الانتقال.";
  }else{
    message="🔁 تحتاج إلى مراجعة الوحدة وإعادة الاختبار.";
  }

  document.getElementById("resultContent").innerHTML=`
    <div class="score">${score} / ${quizQuestions.length}</div>

    <div class="score">${percent}%</div>

    <div class="example">
      ${message}
    </div>

    <button class="primary"
      onclick="openUnit(${currentUnit})">
      📖 مراجعة الوحدة
    </button>

    <button class="secondary"
      onclick="startQuiz()">
      🔄 إعادة الاختبار
    </button>

    ${
      currentUnit < units.length-1
      ?
      `<button class="primary"
        onclick="openUnit(${currentUnit+1})">
        ➡️ الوحدة التالية
      </button>`
      :
      `<div class="example">
        🎉 أكملت جميع وحدات A1!
      </div>`
    }
  `;
}

function showMistakes(){

  hideAll();

  document.getElementById("mistakes").classList.remove("hidden");

  const box=document.getElementById("mistakeContent");

  if(mistakes.length===0){

    box.innerHTML=`
      <div class="example">
        🎉 لا توجد أخطاء محفوظة حاليًا.
      </div>
    `;

    return;
  }

  box.innerHTML="";

  mistakes.slice(-30).reverse().forEach((m,index)=>{

    box.innerHTML += `
      <div class="unit">

        <b>السؤال:</b>
        <div class="en">${m.question}</div>

        <p>
          <b>الإجابة الصحيحة:</b>
          ${m.answer}
        </p>

      </div>
    `;

  });

  box.innerHTML += `
    <button class="danger" onclick="clearMistakes()">
      حذف سجل الأخطاء
    </button>
  `;
}

function clearMistakes(){

  mistakes=[];

  save();

  showMistakes();

}

function resetProgress(){

  if(confirm("هل تريد حذف تقدم A1 بالكامل؟")){

    progress={};
    mistakes=[];

    save();

    renderUnits();

    alert("تمت إعادة البرنامج من البداية.");

  }
}

renderUnits();

</script>
