<script>
"use strict";

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY = "laith_english_trainer_a1_a2_v6";

const defaultState = {
  version:6,
  answered:0,
  correct:0,
  xp:0,
  streak:0,
  lastDate:"",
  completedUnits:{},
  unitBest:{},
  wrong:[],
  vocabKnown:{},
  vocabIndex:0,
  skillStats:{
    listening:0,
    reading:0,
    writing:0,
    speaking:0
  },
  examScores:{
    A1:null,
    A2:null,
    FINAL:null
  }
};

function cloneDefault(){
  return JSON.parse(JSON.stringify(defaultState));
}

function safeLoad(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return cloneDefault();

    const parsed=JSON.parse(raw);
    const s=cloneDefault();

    Object.keys(s).forEach(k=>{
      if(parsed[k]!==undefined) s[k]=parsed[k];
    });

    s.completedUnits=parsed.completedUnits||{};
    s.unitBest=parsed.unitBest||{};
    s.wrong=Array.isArray(parsed.wrong)?parsed.wrong:[];
    s.vocabKnown=parsed.vocabKnown||{};
    s.skillStats=Object.assign(cloneDefault().skillStats,parsed.skillStats||{});
    s.examScores=Object.assign(cloneDefault().examScores,parsed.examScores||{});

    return s;
  }catch(e){
    return cloneDefault();
  }
}

let state=safeLoad();

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  }catch(e){}
  updateXP();
}

function todayString(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function registerStudyDay(){
  const t=todayString();
  if(state.lastDate===t)return;

  const yesterday=new Date();
  yesterday.setDate(yesterday.getDate()-1);
  const y=yesterday.getFullYear()+"-"+String(yesterday.getMonth()+1).padStart(2,"0")+"-"+String(yesterday.getDate()).padStart(2,"0");

  if(state.lastDate===y) state.streak++;
  else state.streak=1;

  state.lastDate=t;
}

function updateXP(){
  const el=document.getElementById("xpBox");
  if(el)el.textContent="XP: "+state.xp;
}

function mastery(){
  if(state.answered<=0)return 0;
  return Math.round((state.correct/state.answered)*100);
}

/* =========================================================
   QUIZ ENGINE
========================================================= */

function makeUnitQuestions(unitId){
  const u=findUnit(unitId);
  if(!u)return [];

  return u.questions.map((x,i)=>({
    id:u.id+"_"+i,
    unitId:u.id,
    level:u.id.startsWith("A1")?"A1":"A2",
    type:"unit",
    question:x[0],
    answer:x[1],
    options:x[2],
    explanation:x[3]
  }));
}

function startUnitQuiz(unitId){
  const qs=makeUnitQuestions(unitId);
  if(!qs.length)return;

  registerStudyDay();

  currentQuiz={
    type:"unit",
    unitId:unitId,
    title:findUnit(unitId).title,
    questions:shuffle(qs),
    index:0,
    score:0,
    answered:false
  };

  renderQuiz();
}

function startWrongQuiz(){
  if(!state.wrong.length){
    alert("لا توجد أسئلة أخطأت بها للمراجعة.");
    return;
  }

  registerStudyDay();

  const qs=state.wrong.map(w=>Object.assign({},w));

  currentQuiz={
    type:"wrong",
    title:"مراجعة الأخطاء",
    questions:shuffle(qs),
    index:0,
    score:0,
    answered:false
  };

  renderQuiz();
}

function buildExam(level){
  const units=level==="A1"?A1:(level==="A2"?A2:allUnits());
  let qs=[];

  units.forEach(u=>{
    u.questions.forEach((x,i)=>{
      qs.push({
        id:"EX_"+level+"_"+u.id+"_"+i,
        unitId:u.id,
        level:u.id.startsWith("A1")?"A1":"A2",
        type:"exam",
        question:x[0],
        answer:x[1],
        options:x[2],
        explanation:x[3]
      });
    });
  });

  return shuffle(qs).slice(0,Math.min(20,qs.length));
}

function startExam(level){
  registerStudyDay();

  const title=level==="FINAL"
    ?"الاختبار النهائي A1 + A2"
    :"الاختبار النهائي "+level;

  currentQuiz={
    type:"exam",
    examLevel:level,
    title:title,
    questions:buildExam(level),
    index:0,
    score:0,
    answered:false
  };

  renderQuiz();
}

function shuffle(arr){
  return arr.slice().sort(()=>Math.random()-0.5);
}

function escapeHTML(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function renderQuiz(){
  if(!currentQuiz || !currentQuiz.questions.length){
    showHome();
    return;
  }

  const q=currentQuiz.questions[currentQuiz.index];

  if(!q){
    finishQuiz();
    return;
  }

  currentQuiz.answered=false;

  const total=currentQuiz.questions.length;
  const number=currentQuiz.index+1;
  const pct=Math.round((currentQuiz.index/total)*100);

  render(`
    <section class="card">
      <div class="unit-head">
        <div>
          <h2>${escapeHTML(currentQuiz.title)}</h2>
          <p class="muted">السؤال ${number} من ${total}</p>
        </div>
        <span class="badge">${pct}%</span>
      </div>

      <div class="progress">
        <div style="width:${pct}%"></div>
      </div>

      <div class="question">${escapeHTML(q.question)}</div>

      <div class="options">
        ${q.options.map((o,i)=>`
          <button class="option" id="option_${i}" onclick="answerQuiz(${i})">
            ${escapeHTML(o)}
          </button>
        `).join("")}
      </div>

      <div id="feedback"></div>
      <div id="nextArea"></div>
    </section>
  `);
}

function saveWrong(q){
  if(!q || q.type==="wrong")return;

  const exists=state.wrong.some(x=>x.id===q.id);

  if(!exists){
    state.wrong.push({
      id:q.id,
      unitId:q.unitId,
      level:q.level,
      type:"savedWrong",
      question:q.question,
      answer:q.answer,
      options:q.options,
      explanation:q.explanation
    });
  }
}

function removeWrong(q){
  if(!q)return;

  state.wrong=state.wrong.filter(x=>x.id!==q.id);
}

function answerQuiz(choice){
  if(!currentQuiz || currentQuiz.answered)return;

  const q=currentQuiz.questions[currentQuiz.index];
  if(!q)return;

  currentQuiz.answered=true;

  const selected=q.options[choice];
  const correct=selected===q.answer;

  document.querySelectorAll(".option").forEach((el,i)=>{
    el.disabled=true;

    if(q.options[i]===q.answer){
      el.classList.add("correct");
    }

    if(i===choice && !correct){
      el.classList.add("wrong");
    }
  });

  if(correct){
    currentQuiz.score++;
    state.correct++;
    state.xp+=10;

    if(q.type==="savedWrong"){
      removeWrong(q);
    }

    showFeedback(true,"إجابة صحيحة ✅",q.explanation);
  }else{
    saveWrong(q);
    state.xp+=2;

    showFeedback(false,
      "إجابة غير صحيحة ❌",
      "الإجابة الصحيحة: <b>"+escapeHTML(q.answer)+"</b><br>"+escapeHTML(q.explanation)
    );
  }

  state.answered++;
  registerStudyDay();
  saveState();

  const last=currentQuiz.index>=currentQuiz.questions.length-1;

  document.getElementById("nextArea").innerHTML=`
    <button class="btn ${last?"success":""}" onclick="${last?"finishQuiz()":"nextQuestion()"}">
      ${last?"عرض النتيجة":"السؤال التالي →"}
    </button>
  `;
}

function showFeedback(good,title,text){
  const el=document.getElementById("feedback");
  if(!el)return;

  el.innerHTML=`
    <div class="feedback ${good?"good":"bad"}">
      ${title}<br>
      <span style="font-weight:400">${text}</span>
    </div>
  `;
}

function nextQuestion(){
  if(!currentQuiz)return;

  currentQuiz.index++;

  if(currentQuiz.index>=currentQuiz.questions.length){
    finishQuiz();
    return;
  }

  renderQuiz();
}

function finishQuiz(){
  if(!currentQuiz)return;

  const quiz=currentQuiz;
  const total=quiz.questions.length;
  const score=quiz.score;
  const pct=total?Math.round((score/total)*100):0;

  if(quiz.type==="unit" && quiz.unitId){
    const old=state.unitBest[quiz.unitId]||0;

    if(pct>old){
      state.unitBest[quiz.unitId]=pct;
    }

    if(pct>=80){
      state.completedUnits[quiz.unitId]=true;
    }
  }

  if(quiz.type==="exam"){
    state.examScores[quiz.examLevel]=pct;
  }

  saveState();

  let message="استمر بالتدريب 💪";

  if(pct>=90)message="ممتاز جدًا 🌟";
  else if(pct>=80)message="ممتاز، مستوى جيد جدًا 👍";
  else if(pct>=60)message="جيد، لكن نحتاج إلى مراجعة بعض النقاط.";
  else message="نحتاج إلى مراجعة الدرس ثم إعادة الاختبار.";

  let buttons="";

  if(quiz.type==="unit"){
    buttons=`
      <button class="btn" onclick="startUnitQuiz('${quiz.unitId}')">إعادة الاختبار</button>
      <button class="btn secondary" onclick="openLesson('${quiz.unitId}')">مراجعة الدرس</button>
      <button class="btn gray" onclick="showUnits()">الوحدات</button>
    `;
  }else if(quiz.type==="wrong"){
    buttons=`
      ${state.wrong.length
        ? `<button class="btn" onclick="startWrongQuiz()">إعادة الأخطاء المتبقية</button>`
        : `<button class="btn success" onclick="showHome()">لا توجد أخطاء متبقية 🎉</button>`
      }
      <button class="btn secondary" onclick="showProgress()">التقدم</button>
      <button class="btn gray" onclick="showHome()">الرئيسية</button>
    `;
  }else if(quiz.type==="exam"){
    buttons=`
      <button class="btn" onclick="startExam('${quiz.examLevel}')">إعادة الاختبار</button>
      <button class="btn secondary" onclick="showExams()">اختبارات المستوى</button>
      <button class="btn gray" onclick="showHome()">الرئيسية</button>
    `;
  }

  render(`
    <section class="card center">
      <div class="big">${pct}%</div>
      <h2>${escapeHTML(quiz.title)}</h2>
      <p>النتيجة: <b>${score}</b> من <b>${total}</b></p>
      <p>${message}</p>

      <div class="progress" style="margin:20px 0">
        <div style="width:${pct}%"></div>
      </div>

      ${quiz.type==="wrong"
        ? `<p class="muted">الأخطاء المتبقية: ${state.wrong.length}</p>`
        : ""
      }

      <div class="buttons" style="justify-content:center">
        ${buttons}
      </div>
    </section>
  `);

  currentQuiz=null;
}

function startVocabulary(){
  vocabSession={
    index:state.vocabIndex%VOCAB.length,
    order:shuffle([...Array(VOCAB.length).keys()]),
    shown:false
  };

  renderVocabularyCard();

function renderVocabularyCard(){
  if(!vocabSession){
    showVocabulary();
    return;
  }

  const i=vocabSession.order[vocabSession.index];
  const word=VOCAB[i];

  render(`
    <section class="card">
      <button class="btn secondary small" onclick="showVocabulary()">← المفردات</button>

      <div class="word">${escapeHTML(word[0])}</div>
      <div class="word-ar">${escapeHTML(word[1])}</div>

      <div class="center" style="margin:18px 0">
        <button class="btn secondary" onclick="speakText('${escapeHTML(word[0])}','en-US')">🔊 النطق</button>
      </div>

      <p class="center muted">
        هل تعرف هذه الكلمة؟
      </p>

      <div class="buttons">
        <button class="btn success" onclick="vocabKnown(true)">أعرفها ✓</button>
        <button class="btn danger" onclick="vocabKnown(false)">أحتاج مراجعتها</button>
      </div>

      <hr>
      <p class="muted center">
        الكلمة ${vocabSession.index+1} من ${vocabSession.order.length}
      </p>
    </section>
  `);
}

function vocabKnown(known){
  const i=vocabSession.order[vocabSession.index];

  if(known){
    state.vocabKnown[i]=true;
    state.xp+=3;
  }else{
    delete state.vocabKnown[i];
  }

  state.vocabIndex=(i+1)%VOCAB.length;
  saveState();

  vocabSession.index++;

  if(vocabSession.index>=vocabSession.order.length){
    render(`
      <section class="card center">
        <div class="big">🎉</div>
        <h2>انتهت جولة المفردات</h2>
        <p>تم حفظ الكلمات التي قلت إنك تعرفها.</p>
        <button class="btn" onclick="showVocabulary()">العودة للمفردات</button>
      </section>
    `);
    vocabSession=null;
    return;
  }

  renderVocabularyCard();
}

      <div class="options">
        ${item.options.map((o,i)=>`
          <button class="option" id="skill_${i}" onclick="answerSkill(${i})">
            ${escapeHTML(o)}
          </button>
        `).join("")}
      </div>

      <div id="skillFeedback"></div>
      <div id="skillNext"></div>
    </section>
  `);
}

function answerSkill(choice){
  if(!currentSkill || currentSkill.answered)return;

  currentSkill.answered=true;

  const item=currentSkill.data[currentSkill.index];
  const correct=choice===item.answer;

  document.querySelectorAll(".option").forEach((el,i)=>{
    el.disabled=true;

    if(i===item.answer)el.classList.add("correct");
    if(i===choice&&!correct)el.classList.add("wrong");
  });

  if(correct){
    currentSkill.score++;
    state.skillStats[currentSkill.type]++;
    state.xp+=5;

    document.getElementById("skillFeedback").innerHTML=
      `<div class="feedback good">إجابة صحيحة ✅</div>`;
  }else{
    document.getElementById("skillFeedback").innerHTML=
      `<div class="feedback bad">إجابة غير صحيحة ❌<br>الصحيح: ${escapeHTML(item.options[item.answer])}</div>`;
  }

  saveState();

  document.getElementById("skillNext").innerHTML=`
    <button class="btn" onclick="nextSkillQuestion()">
      ${currentSkill.index===currentSkill.data.length-1?"النتيجة":"التالي →"}
    </button>
  `;
}

function nextSkillQuestion(){
  currentSkill.index++;

  if(currentSkill.index>=currentSkill.data.length){
    const pct=Math.round((currentSkill.score/currentSkill.data.length)*100);

    render(`
      <section class="card center">
        <div class="big">${pct}%</div>
        <h2>انتهى تدريب ${currentSkill.type==="listening"?"الاستماع":"القراءة"}</h2>
        <p>${currentSkill.score} من ${currentSkill.data.length}</p>
        <button class="btn" onclick="showSkills()">العودة للمهارات</button>
      </section>
    `);

    currentSkill=null;
    return;
  }

  currentSkill.answered=false;
  renderSkillQuestion();
}

/* =========================================================
   WRITING
========================================================= */

function startWriting(){
  render(`
    <section class="card">
      <button class="btn secondary small" onclick="showSkills()">← المهارات</button>
      <h2 style="margin-top:15px">✍️ تدريب الكتابة</h2>

      <div class="rule">
        اكتب 3 جمل إنجليزية عن نفسك أو عملك أو يومك.
        حاول استخدام:
        <br>1. Present Simple
        <br>2. Present Continuous
        <br>3. Past Simple أو Present Perfect
      </div>

      <textarea id="writingInput" placeholder="Example:
I work every day.
I am studying English now.
I went to work yesterday."></textarea>

      <button class="btn" style="margin-top:10px" onclick="checkWriting()">فحص الكتابة</button>

      <div id="writingResult"></div>
    </section>
  `);
}

function checkWriting(){
  const input=(document.getElementById("writingInput")?.value||"").trim();

  if(!input){
    alert("اكتب شيئًا أولًا.");
    return;
  }

  const sentences=input.split(/[.!?]+/).map(x=>x.trim()).filter(Boolean);
  const words=input.split(/\s+/).filter(Boolean);

  let score=0;
  const notes=[];

  if(words.length>=8){
    score++;
  }else{
    notes.push("حاول كتابة عدد أكبر من الكلمات.");
  }

  if(/\b(I|you|we|they|he|she|it)\b/i.test(input)){
    score++;
  }else{
    notes.push("حاول استخدام ضمائر مثل I / you / he / she.");
  }

  if(/\b(am|is|are|do|does|did|have|has|will|can|should|must)\b/i.test(input)){
    score++;
  }else{
    notes.push("حاول استخدام فعل مساعد مناسب.");
  }

  if(sentences.length>=3){
    score++;
  }else{
    notes.push("اكتب ثلاث جمل أو أكثر.");
  }

  const pct=Math.round((score/4)*100);

  state.skillStats.writing++;
  state.xp+=5;
  saveState();

  document.getElementById("writingResult").innerHTML=`
    <div class="feedback ${pct>=75?"good":"bad"}">
      <b>التقييم المبدئي: ${pct}%</b><br>
      عدد الجمل: ${sentences.length}<br>
      عدد الكلمات: ${words.length}
      ${notes.length
        ? `<hr><b>ملاحظات:</b><br>${notes.map(n=>"• "+escapeHTML(n)).join("<br>")}`
        : `<hr>ممتاز! استمر بهذا الأسلوب.`
      }
    </div>
  `;
}

/* =========================================================
   SPEAKING
========================================================= */

function startSpeaking(){
  render(`
    <section class="card">
      <button class="btn secondary small" onclick="showSkills()">← المهارات</button>
      <h2 style="margin-top:15px">🗣️ تدريب التحدث</h2>

      <p class="muted">
        اضغط على 🔊 للاستماع، ثم اقرأ الجملة بصوت مرتفع وحاول تقليد النطق.
      </p>

      <div id="speakingArea"></div>
    </section>
  `);

  renderSpeakingItem(0);
}

function renderSpeakingItem(i){
  if(i>=SPEAKING.length){
    state.skillStats.speaking++;
    state.xp+=10;
    saveState();

    document.getElementById("speakingArea").innerHTML=`
      <div class="center">
        <div class="big">🎉</div>
        <h3>أكملت تدريب التحدث</h3>
        <button class="btn" onclick="showSkills()">العودة للمهارات</button>
      </div>
    `;
    return;
  }

  const text=SPEAKING[i];

  document.getElementById("speakingArea").innerHTML=`
    <div class="card" style="background:#f8fafc">
      <div class="question" style="font-size:20px">${escapeHTML(text)}</div>

      <div class="buttons" style="justify-content:center">
        <button class="btn" onclick="speakText('${escapeHTML(text)}','en-US')">🔊 استمع</button>
        <button class="btn secondary" onclick="startRecognition('${escapeHTML(text)}')">🎤 حاول التحدث</button>
      </div>

      <div id="recognitionResult"></div>

      <hr>

      <button class="btn" onclick="renderSpeakingItem(${i+1})">الجملة التالية →</button>
    </div>
  `;
}

function speakText(text,lang){
  if(!("speechSynthesis" in window)){
    alert("النطق الصوتي غير مدعوم في هذا المتصفح.");
    return;
  }

  try{
    window.speechSynthesis.cancel();

    const utter=new SpeechSynthesisUtterance(text);
    utter.lang=lang||"en-US";
    utter.rate=.82;
    utter.pitch=1;

    window.speechSynthesis.speak(utter);
  }catch(e){
    alert("تعذر تشغيل النطق.");
  }
}

function startRecognition(target){
  const Result=document.getElementById("recognitionResult");
  if(!Result)return;

  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!Recognition){
    Result.innerHTML=`
      <div class="feedback bad">
        ميزة التعرف على الكلام غير متاحة في هذا المتصفح.
        يمكنك الاستماع للجملة ثم نطقها بنفسك.
      </div>
    `;
    return;
  }

  try{
    const rec=new Recognition();
    rec.lang="en-US";
    rec.interimResults=false;
    rec.maxAlternatives=1;

    Result.innerHTML=`<div class="feedback">🎤 استمعنا لك... تحدث الآن.</div>`;

    rec.onresult=function(event){
      const spoken=event.results[0][0].transcript;

      Result.innerHTML=`
        <div class="feedback good">
          ما سمعه الجهاز:<br>
          <b dir="ltr">${escapeHTML(spoken)}</b>
          <hr>
          الجملة المطلوبة:<br>
          <b dir="ltr">${escapeHTML(target)}</b>
        </div>
      `;

      state.skillStats.speaking++;
      state.xp+=3;
      saveState();
    };

    rec.onerror=function(){
      Result.innerHTML=`
        <div class="feedback bad">
          لم يتم التعرف على الكلام. حاول مرة أخرى وتحدث بوضوح.
        </div>
      `;
    };

    rec.start();
  }catch(e){
    Result.innerHTML=`
      <div class="feedback bad">
        تعذر تشغيل الميكروفون. يمكنك الاستمرار بالنطق يدويًا.
      </div>
    `;
  }
}

        <tr><td>Reading</td><td>${state.skillStats.reading}</td></tr>

/* =========================================================
   EXPORT / IMPORT
========================================================= */

function exportProgress(){
  try{
    const data=JSON.stringify(state,null,2);
    const blob=new Blob([data],{type:"application/json"});
    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");
    a.href=url;
    a.download="english-trainer-laith-progress.json";
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){
    alert("تعذر تصدير التقدم.");
  }
}

function importProgress(event){
  const file=event.target.files?.[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(){
    try{
      const imported=JSON.parse(reader.result);

      if(!imported || typeof imported!=="object"){
        throw new Error("Invalid data");
      }

      const s=cloneDefault();

      Object.keys(s).forEach(k=>{
        if(imported[k]!==undefined)s[k]=imported[k];
      });

      state=s;
      saveState();

      alert("تم استيراد التقدم بنجاح.");
      showProgress();
    }catch(e){
      alert("ملف التقدم غير صالح.");
    }

    event.target.value="";
  };

  reader.readAsText(file);
}

function resetProgress(){
  const ok=confirm("هل أنت متأكد؟ سيتم حذف تقدمك المحفوظ على هذا الجهاز.");

  if(!ok)return;

  state=cloneDefault();
  saveState();
  showHome();
}

/* =========================================================
   SELF CHECK
========================================================= */

function selfCheck(){
  const errors=[];

  if(!Array.isArray(A1)||!Array.isArray(A2))errors.push("Curriculum arrays");
  if(VOCAB.length<10)errors.push("Vocabulary");

  allUnits().forEach(u=>{
    if(!u.id||!u.title||!Array.isArray(u.questions)){
      errors.push("Unit: "+u.id);
    }

    u.questions.forEach((q,i)=>{
      if(!Array.isArray(q)||q.length<4){
        errors.push(u.id+" question "+i);
      }
    });
  });

  [
    "showHome",
    "showUnits",
    "showVocabulary",
    "showSkills",
    "showProgress",
    "showExams",
    "startUnitQuiz",
    "startWrongQuiz",
    "startExam",
    "answerQuiz",
    "nextQuestion",
    "finishQuiz"
  ].forEach(fn=>{
    if(typeof window[fn]!=="function")errors.push("Missing function: "+fn);
  });

  return errors;
}

(function init(){
  const errors=selfCheck();

  if(errors.length){
    console.error("Self check errors:",errors);
  }

  showHome();
})();
</script>
