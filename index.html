let progress = JSON.parse(localStorage.getItem("a1progress") || "{}");

let currentUnit = 0;

let currentQuestion = 0;

let score = 0;

function save(){

localStorage.setItem("a1progress",JSON.stringify(progress));

}

function renderUnits(){

let html="";

units.forEach((u,i)=>{

let done=progress[i] ? "done":"";

let mark=progress[i] ? "✅":"📘";

html+=`

<div class="unit ${done}">

<h3>${mark} ${u.title}</h3>

<p class="small">${progress[i] ? "تم الإنجاز":"لم تدرس بعد"}</p>

<button class="primary" onclick="openLesson(${i})">ابدأ الدرس</button>

</div>`;

});

document.getElementById("units").innerHTML=html;

updateProgress();

}

function updateProgress(){

let done=Object.keys(progress).length;

let percent=Math.round(done/units.length*100);

document.getElementById("progressBar").style.width=percent+"%";

document.getElementById("progressText").innerText=

`أنجزت ${done} من ${units.length} وحدة — ${percent}%`;

}

function openLesson(i){

currentUnit=i;

document.getElementById("home").style.display="none";

let u=units[i];

document.getElementById("lesson").style.display="block";

document.getElementById("quiz").style.display="none";

document.getElementById("lesson").innerHTML=`

<div class="card">

<h2>${u.title}</h2>

${u.explain}

<hr>

<h3>🎯 تدريب واختبار الدرس</h3>

<p>بعد قراءة الشرح والأمثلة، اضغط على الزر للبدء.</p>

<button class="primary" onclick="startQuiz()">ابدأ الاختبار</button>

<button class="secondary" onclick="goHome()">رجوع للوحدات</button>

</div>`;

}

function startQuiz(){

currentQuestion=0;

score=0;

document.getElementById("lesson").style.display="none";

document.getElementById("quiz").style.display="block";

showQuestion();

}

function showQuestion(){

let q=units[currentUnit].questions[currentQuestion];

let html=`

<div class="card">

<p class="small">السؤال ${currentQuestion+1} من ${units[currentUnit].questions.length}</p>

<h2>${q[0]}</h2>

<button class="option" onclick="answer('A',this)">${q[1]}</button>

<button class="option" onclick="answer('B',this)">${q[2]}</button>

<button class="option" onclick="answer('C',this)">${q[3]}</button>

<div id="feedback"></div>

</div>`;

document.getElementById("quiz").innerHTML=html;

}

function answer(letter,button){

let q=units[currentUnit].questions[currentQuestion];

let buttons=document.querySelectorAll(".option");

buttons.forEach(b=>b.disabled=true);

if(letter===q[4]){

button.classList.add("correct");

score++;

document.getElementById("feedback").innerHTML=

`<div class="example">✅ إجابة صحيحة!</div>`;

}else{

button.classList.add("wrong");

let correctIndex=q[4]==="A"?1:q[4]==="B"?2:3;

buttons[correctIndex-1].classList.add("correct");

document.getElementById("feedback").innerHTML=

`<div class="example">❌ خطأ.<br>الإجابة الصحيحة: <b>${q[correctIndex]}</b></div>`;

}

setTimeout(()=>{

currentQuestion++;

if(currentQuestion < units[currentUnit].questions.length){

showQuestion();

}else{

finishQuiz();

}

},1200);

}

function finishQuiz(){

let total=units[currentUnit].questions.length;

let percent=Math.round(score/total*100);

if(percent>=70){

progress[currentUnit]=true;

save();

}

document.getElementById("quiz").innerHTML=`

<div class="card">

<h2>🏆 انتهى الاختبار</h2>

<div class="score">

${score} / ${total}<br>

${percent}%

</div>

<p style="text-align:center">

${percent>=70

?"🎉 ممتاز! تم اجتياز الوحدة."

:"📚 لم تصل إلى 70%. راجع الدرس وأعد الاختبار."}

</p>

${percent<70?

`<button class="primary" onclick="openLesson(${currentUnit})">راجع الدرس</button>`

:

`<button class="primary" onclick="nextUnit()">الوحدة التالية</button>`

}

<button class="secondary" onclick="goHome()">قائمة الوحدات</button>

</div>`;

}

function nextUnit(){

if(currentUnit < units.length-1){

openLesson(currentUnit+1);

}else{

goHome();

alert("🎉 أكملت جميع وحدات A1!");

}

}

function goHome(){

document.getElementById("lesson").style.display="none";

document.getElementById("quiz").style.display="none";

document.getElementById("home").style.display="block";

renderUnits();

window.scrollTo(0,0);

}

function resetProgress(){

if(confirm("هل تريد حذف تقدمك بالكامل؟")){

progress={};

save();

renderUnits();

}

}

renderUnits();

</script>
