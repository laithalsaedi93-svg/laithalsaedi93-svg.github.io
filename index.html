<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>English Trainer A1 → A2 | Laith</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f1f5f9;color:#172033}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:900px;margin:auto;padding-bottom:40px}
header{
 background:linear-gradient(135deg,#1d4ed8,#2563eb);
 color:white;padding:24px 16px;border-radius:0 0 24px 24px;
 box-shadow:0 4px 18px #0002
}
header h1{margin:0 0 8px;font-size:25px}
header p{margin:0;opacity:.92;font-size:14px}
nav{
 display:grid;grid-template-columns:repeat(4,1fr);gap:7px;
 padding:10px;background:white;position:sticky;top:0;z-index:10;
 box-shadow:0 2px 8px #0001
}
nav button{
 border:0;background:#eef2ff;color:#1e40af;padding:10px 4px;
 border-radius:10px;font-size:12px
}
nav button.active{background:#2563eb;color:white}
main{padding:14px}
.page{display:none}
.page.active{display:block}
.card{
 background:white;border-radius:17px;padding:16px;margin-bottom:13px;
 box-shadow:0 2px 10px #0000000b;border:1px solid #e5e7eb
}
.hero{
 background:linear-gradient(135deg,#eff6ff,#dbeafe);
 border:1px solid #bfdbfe
}
h2{font-size:21px;margin:0 0 12px}
h3{font-size:17px;margin:0 0 9px}
p{line-height:1.7}
.small{font-size:13px;color:#64748b}
.muted{color:#64748b}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{
 border:0;border-radius:11px;padding:11px 15px;background:#2563eb;color:white;
 font-weight:600
}
.btn.secondary{background:#e2e8f0;color:#172033}
.btn.success{background:#16a34a}
.btn.danger{background:#dc2626}
.btn.warning{background:#f59e0b;color:#111827}
.btn:disabled{opacity:.5;cursor:not-allowed}
.progress{
 height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden
}
.progress>div{height:100%;background:#2563eb;transition:.3s}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{
 background:#f8fafc;border-radius:12px;padding:12px;text-align:center
}
.stat b{display:block;font-size:22px;color:#1d4ed8}
.units{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px
}
.unit{
 border:1px solid #e2e8f0;background:#fff;border-radius:15px;padding:14px
}
.unit.done{border-color:#86efac;background:#f0fdf4}
.unit .tag{
 display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;
 background:#dbeafe;color:#1d4ed8;margin-bottom:8px
}
.unit.done .tag{background:#dcfce7;color:#166534}
.unit-title{font-weight:700;margin-bottom:5px}
.unit-desc{font-size:13px;color:#64748b;min-height:40px}
.lesson-rule{
 background:#eff6ff;border-right:4px solid #2563eb;padding:13px;
 border-radius:10px;line-height:1.8
}
.example{
 padding:10px;margin:7px 0;background:#f8fafc;border-radius:10px;
 border:1px solid #e2e8f0
}
.example .en{font-weight:700;direction:ltr;text-align:left}
.example .ar{color:#475569}
.choice{
 width:100%;text-align:right;border:1px solid #cbd5e1;background:white;
 border-radius:12px;padding:13px;margin:7px 0
}
.choice:hover{background:#eff6ff}
.choice.correct{background:#dcfce7;border-color:#16a34a}
.choice.wrong{background:#fee2e2;border-color:#dc2626}
.question{
 font-size:20px;font-weight:700;direction:ltr;text-align:left;
 background:#f8fafc;padding:16px;border-radius:12px;margin-bottom:12px
}
.feedback{
 padding:13px;border-radius:12px;margin-top:12px;line-height:1.7
}
.feedback.good{background:#dcfce7;color:#166534}
.feedback.bad{background:#fee2e2;color:#991b1b}
.vocab{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px
}
.vocab-item{
 background:white;border:1px solid #e2e8f0;padding:13px;border-radius:13px
}
.vocab-word{font-size:18px;font-weight:700;direction:ltr;text-align:left}
.input{
 width:100%;border:1px solid #cbd5e1;border-radius:11px;
 padding:12px;margin:6px 0;background:white
}
textarea.input{min-height:120px;resize:vertical}
.skill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.skill-card{
 background:white;border:1px solid #e2e8f0;border-radius:15px;padding:15px
}
.empty{text-align:center;padding:25px;color:#64748b}
.badge{
 display:inline-block;padding:5px 9px;border-radius:20px;
 background:#e0e7ff;color:#3730a3;font-size:12px
}
.footer{text-align:center;color:#64748b;font-size:12px;padding:20px}
.hidden{display:none!important}
@media(max-width:600px){
 header h1{font-size:21px}
 nav{grid-template-columns:repeat(4,1fr)}
 nav button{font-size:10px;padding:9px 2px}
 .statgrid{grid-template-columns:repeat(3,1fr)}
 .stat{padding:8px}
 .stat b{font-size:18px}
 .skill-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="app">

<header>
<h1>English Trainer A1 → A2 | Laith</h1>
<p>برنامج تدريب شخصي — شرح + تدريب + اختبار + متابعة</p>
</header>

<nav>
<button id="navHome" onclick="showPage('home')">الرئيسية</button>
<button id="navUnits" onclick="showPage('units')">الوحدات</button>
<button id="navVocab" onclick="showPage('vocab')">المفردات</button>
<button id="navSkills" onclick="showPage('skills')">المهارات</button>
</nav>

<main>

<section id="home" class="page active"></section>
<section id="units" class="page"></section>
<section id="vocab" class="page"></section>
<section id="skills" class="page"></section>
<section id="lesson" class="page"></section>
<section id="quiz" class="page"></section>
<section id="progressPage" class="page"></section>
<section id="exams" class="page"></section>

</main>

<div class="footer">
English Trainer A1 → A2 | Laith<br>
يتم حفظ تقدمك على جهازك تلقائياً.
</div>

</div>

<script>
"use strict";

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY = "laith_english_trainer_a1_a2_v42";

const defaultState = {
 version:42,
 answered:0,
 correct:0,
 xp:0,
 streak:0,
 lastDate:"",
 completedUnits:{},
 unitBest:{},
 wrong:{},
 vocabKnown:{
  want:true,
  need:true,
  know:true,
  think:true,
  make:true,
  take:true,
  give:true,
  get:true,
  come:true,
  go:true
 },
 vocabIndex:0,
 skillStats:{
  reading:0,
  listening:0,
  writing:0,
  speaking:0
 },
 examScores:{
  A1:null,
  A2:null,
  ALL:null
 }
};

function clone(obj){
 return JSON.parse(JSON.stringify(obj));
}

function loadState(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  if(raw){
   const parsed=JSON.parse(raw);
   return Object.assign(clone(defaultState),parsed,{
    completedUnits:Object.assign({},defaultState.completedUnits,parsed.completedUnits||{}),
    unitBest:Object.assign({},defaultState.unitBest,parsed.unitBest||{}),
    wrong:Object.assign({},defaultState.wrong,parsed.wrong||{}),
    vocabKnown:Object.assign({},defaultState.vocabKnown,parsed.vocabKnown||{}),
    skillStats:Object.assign({},defaultState.skillStats,parsed.skillStats||{}),
    examScores:Object.assign({},defaultState.examScores,parsed.examScores||{})
   });
  }
 }catch(e){}
 return clone(defaultState);
}

let state=loadState();

function saveState(){
 try{
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
 }catch(e){}
}

/* =========================================================
   42 UNITS
========================================================= */

const units=[
/* ================= A1 ================= */
{id:"A1U1",level:"A1",n:1,title:"Verb to be — am / is / are",desc:"استخدام am / is / are مع الضمائر.",rule:"نستخدم am مع I، و is مع he / she / it، و are مع you / we / they.",examples:[
 ["I am happy.","أنا سعيد."],
 ["She is a teacher.","هي معلمة."],
 ["They are ready.","هم مستعدون."]
],type:"be"},

{id:"A1U2",level:"A1",n:2,title:"Subject Pronouns",desc:"ضمائر الفاعل الأساسية.",rule:"ضمائر الفاعل هي I, you, he, she, it, we, they، وتأتي قبل الفعل غالباً.",examples:[
 ["He is my friend.","هو صديقي."],
 ["We live in Basra.","نحن نعيش في البصرة."],
 ["They work here.","هم يعملون هنا."]
],type:"pronouns"},

{id:"A1U3",level:"A1",n:3,title:"Possessive Adjectives",desc:"صفات الملكية my, your, his, her, its, our, their.",rule:"صفة الملكية تأتي قبل الاسم: my car, your book, his phone, her house.",examples:[
 ["This is my car.","هذه سيارتي."],
 ["Her name is Sara.","اسمها سارة."],
 ["Their house is big.","بيتهم كبير."]
],type:"possessive"},

{id:"A1U4",level:"A1",n:4,title:"Articles — a / an / the",desc:"أدوات التعريف والتنكير.",rule:"a قبل صوت ساكن، an قبل صوت متحرك، و the عندما نتحدث عن شيء محدد أو معروف.",examples:[
 ["I have a car.","لدي سيارة."],
 ["She eats an apple.","هي تأكل تفاحة."],
 ["The car is new.","السيارة جديدة."]
],type:"articles"},

{id:"A1U5",level:"A1",n:5,title:"Plural Nouns",desc:"تكوين الجمع للأسماء.",rule:"غالباً نضيف s: book → books. وبعض الكلمات تحتاج es مثل box → boxes.",examples:[
 ["one book, two books","كتاب واحد، كتابان"],
 ["one box, two boxes","صندوق واحد، صندوقان"],
 ["three cars","ثلاث سيارات"]
],type:"plural"},

{id:"A1U6",level:"A1",n:6,title:"There is / There are",desc:"التعبير عن وجود شيء.",rule:"There is للمفرد، و There are للجمع.",examples:[
 ["There is a book on the table.","هناك كتاب على الطاولة."],
 ["There are two cars outside.","هناك سيارتان في الخارج."],
 ["Is there a bank nearby?","هل يوجد مصرف قريب؟"]
],type:"there"},

{id:"A1U7",level:"A1",n:7,title:"Have / Has",desc:"استخدام have و has للملكية.",rule:"نستخدم have مع I / you / we / they، و has مع he / she / it.",examples:[
 ["I have a phone.","لدي هاتف."],
 ["She has a car.","لديها سيارة."],
 ["They have two children.","لديهم طفلان."]
],type:"have"},

{id:"A1U8",level:"A1",n:8,title:"Present Simple",desc:"المضارع البسيط للعادات والحقائق.",rule:"مع he / she / it نضيف s أو es إلى الفعل. مع باقي الضمائر نستخدم الفعل الأساسي.",examples:[
 ["I work every day.","أنا أعمل كل يوم."],
 ["He works every day.","هو يعمل كل يوم."],
 ["They live in Iraq.","هم يعيشون في العراق."]
],type:"simple"},

{id:"A1U9",level:"A1",n:9,title:"Questions & Negatives",desc:"الأسئلة والنفي في المضارع البسيط.",rule:"نستخدم do مع I/you/we/they و does مع he/she/it. بعد does يعود الفعل إلى المصدر.",examples:[
 ["Do you work here?","هل تعمل هنا؟"],
 ["Does he speak English?","هل يتحدث الإنجليزية؟"],
 ["I don't like coffee.","أنا لا أحب القهوة."]
],type:"questions"},

{id:"A1U10",level:"A1",n:10,title:"Adverbs of Frequency",desc:"always, usually, often, sometimes, never.",rule:"تأتي ظروف التكرار غالباً قبل الفعل الرئيسي وبعد فعل be.",examples:[
 ["I always work early.","أنا أعمل دائماً مبكراً."],
 ["He usually drives.","هو يقود عادةً."],
 ["She is always happy.","هي دائماً سعيدة."]
],type:"frequency"},

{id:"A1U11",level:"A1",n:11,title:"Present Continuous",desc:"المضارع المستمر للأفعال التي تحدث الآن.",rule:"am/is/are + verb-ing.",examples:[
 ["I am working now.","أنا أعمل الآن."],
 ["She is studying.","هي تدرس الآن."],
 ["They are playing.","هم يلعبون."]
],type:"continuous"},

{id:"A1U12",level:"A1",n:12,title:"Present Simple vs Present Continuous",desc:"الفرق بين العادة والحدث الجاري الآن.",rule:"Present Simple للعادات والحقائق، و Present Continuous لما يحدث الآن أو حول الوقت الحالي.",examples:[
 ["I work every day.","أعمل كل يوم."],
 ["I am working now.","أنا أعمل الآن."],
 ["He usually drives, but today he is walking.","هو يقود عادةً، لكنه يمشي اليوم."]
],type:"simplecontinuous"},

{id:"A1U13",level:"A1",n:13,title:"Can / Can't",desc:"القدرة وعدم القدرة.",rule:"Can + verb base. لا نضيف s بعد can.",examples:[
 ["I can swim.","أستطيع السباحة."],
 ["She can drive.","تستطيع القيادة."],
 ["He can't speak French.","لا يستطيع التحدث بالفرنسية."]
],type:"can"},

{id:"A1U14",level:"A1",n:14,title:"Imperatives",desc:"صيغة الأمر والتعليمات.",rule:"نستخدم الفعل بصورته الأساسية للأمر: Open the door. ويمكن استخدام Don't للنهي.",examples:[
 ["Open the door.","افتح الباب."],
 ["Sit down.","اجلس."],
 ["Don't touch it.","لا تلمسه."]
],type:"imperative"},

{id:"A1U15",level:"A1",n:15,title:"Prepositions of Place",desc:"in, on, under, next to, behind, between.",rule:"تستخدم حروف الجر لوصف مكان الأشياء والأشخاص.",examples:[
 ["The phone is on the table.","الهاتف على الطاولة."],
 ["The car is in the garage.","السيارة في الكراج."],
 ["The bag is under the chair.","الحقيبة تحت الكرسي."]
],type:"place"},

{id:"A1U16",level:"A1",n:16,title:"Prepositions of Time",desc:"in / on / at للوقت.",rule:"at للساعة، on للأيام والتواريخ، in للأشهر والسنوات والفترات.",examples:[
 ["at 7 o'clock","في الساعة السابعة"],
 ["on Monday","يوم الاثنين"],
 ["in 2026","في سنة 2026"]
],type:"time"},

{id:"A1U17",level:"A1",n:17,title:"Countable & Uncountable Nouns",desc:"الأسماء المعدودة وغير المعدودة.",rule:"Countable يمكن عدها: one apple, two apples. Uncountable مثل water, rice, money.",examples:[
 ["two apples","تفاحتان"],
 ["some water","بعض الماء"],
 ["I need some rice.","أحتاج بعض الأرز."]
],type:"countable"},

{id:"A1U18",level:"A1",n:18,title:"Some / Any / Much / Many",desc:"كلمات الكمية الأساسية.",rule:"some غالباً في الإثبات، any في النفي والأسئلة، many للمعدود و much لغير المعدود.",examples:[
 ["I have some money.","لدي بعض المال."],
 ["Do you have any questions?","هل لديك أي أسئلة؟"],
 ["How many books?","كم كتاباً؟"]
],type:"quantity"},

{id:"A1U19",level:"A1",n:19,title:"Past Simple",desc:"الماضي البسيط للأحداث المنتهية.",rule:"الأفعال المنتظمة تأخذ ed غالباً. الأفعال غير المنتظمة لها صيغة خاصة مثل go → went.",examples:[
 ["I worked yesterday.","عملت أمس."],
 ["She visited Baghdad.","زارت بغداد."],
 ["He went home.","ذهب إلى البيت."]
],type:"past"},

{id:"A1U20",level:"A1",n:20,title:"Future — going to",desc:"المستقبل باستخدام going to.",rule:"am/is/are + going to + verb للتعبير عن خطة أو نية مستقبلية.",examples:[
 ["I am going to study.","سوف أدرس / أنوي الدراسة."],
 ["She is going to travel.","هي ستسافر."],
 ["They are going to work.","هم سيعملون."]
],type:"goingto"},

{id:"A1U21",level:"A1",n:21,title:"A1 Complete Review",desc:"مراجعة شاملة لمستوى A1.",rule:"هذه الوحدة تجمع أهم قواعد A1: be، الضمائر، الملكية، الأدوات، الجمع، there is/are، have/has، المضارع، المستمر، can، حروف الجر، الماضي والمستقبل.",examples:[
 ["I am working today.","أنا أعمل اليوم."],
 ["She has a new car.","لديها سيارة جديدة."],
 ["They went home yesterday.","ذهبوا إلى البيت أمس."]
],type:"reviewA1"},

/* ================= A2 ================= */
{id:"A2U1",level:"A2",n:1,title:"Past Continuous",desc:"الماضي المستمر.",rule:"was/were + verb-ing لوصف فعل كان مستمراً في وقت معين في الماضي.",examples:[
 ["I was working at 8.","كنت أعمل الساعة 8."],
 ["They were sleeping.","كانوا نائمين."],
 ["She was driving.","كانت تقود."]
],type:"pastcontinuous"},

{id:"A2U2",level:"A2",n:2,title:"Past Simple vs Past Continuous",desc:"التمييز بين حدث مستمر وحدث قطعه.",rule:"Past Continuous للفعل المستمر، و Past Simple للحدث الذي حصل أو قطعه.",examples:[
 ["I was sleeping when he called.","كنت نائماً عندما اتصل."],
 ["She was driving when it started to rain.","كانت تقود عندما بدأ المطر."],
 ["They were eating when I arrived.","كانوا يأكلون عندما وصلت."]
],type:"pastmix"},

{id:"A2U3",level:"A2",n:3,title:"Present Perfect",desc:"المضارع التام.",rule:"have/has + past participle. يستخدم للتجارب أو الأحداث المرتبطة بالحاضر.",examples:[
 ["I have finished.","لقد انتهيت."],
 ["She has visited London.","لقد زارت لندن."],
 ["They have arrived.","لقد وصلوا."]
],type:"perfect"},

{id:"A2U4",level:"A2",n:4,title:"Present Perfect — ever / never",desc:"استخدام ever و never.",rule:"ever تستخدم غالباً في الأسئلة عن التجارب، و never للنفي بمعنى أبداً.",examples:[
 ["Have you ever been to London?","هل سبق أن ذهبت إلى لندن؟"],
 ["I have never seen snow.","لم أرَ الثلج أبداً."],
 ["Has he ever driven a truck?","هل سبق أن قاد شاحنة؟"]
],type:"evernever"},

{id:"A2U5",level:"A2",n:5,title:"Present Perfect — just / already / yet",desc:"just و already و yet.",rule:"just لحدث حصل للتو، already لحدث حصل مسبقاً، yet غالباً في الأسئلة والنفي.",examples:[
 ["I have just arrived.","لقد وصلت للتو."],
 ["She has already eaten.","لقد أكلت بالفعل."],
 ["Have you finished yet?","هل انتهيت بعد؟"]
],type:"perfectj"},

{id:"A2U6",level:"A2",n:6,title:"Present Perfect — for / since",desc:"استخدام for و since.",rule:"for + مدة، since + نقطة بداية.",examples:[
 ["I have lived here for five years.","عشت هنا لمدة خمس سنوات."],
 ["I have worked here since 2020.","أعمل هنا منذ 2020."],
 ["She has studied English for two years.","درست الإنجليزية لمدة سنتين."]
],type:"forsince"},

{id:"A2U7",level:"A2",n:7,title:"Present Perfect vs Past Simple",desc:"الفرق بين المضارع التام والماضي البسيط.",rule:"Past Simple مع وقت ماضٍ منتهٍ مثل yesterday. Present Perfect عندما لا نحدد وقتاً منتهياً أو يكون الأثر مرتبطاً بالحاضر.",examples:[
 ["I saw him yesterday.","رأيته أمس."],
 ["I have seen him before.","لقد رأيته من قبل."],
 ["She went to London in 2024.","ذهبت إلى لندن في 2024."]
],type:"perfectpast"},

{id:"A2U8",level:"A2",n:8,title:"Future with will",desc:"المستقبل باستخدام will.",rule:"will + verb base. تستخدم للتنبؤ والقرار السريع والوعود.",examples:[
 ["I will help you.","سأساعدك."],
 ["It will rain.","ستمطر."],
 ["I will call you later.","سأتصل بك لاحقاً."]
],type:"will"},

{id:"A2U9",level:"A2",n:9,title:"Going to vs will",desc:"الفرق بين going to و will.",rule:"going to لخطة أو نية موجودة، و will لقرار لحظي أو توقع.",examples:[
 ["I am going to travel next week.","سأسافر الأسبوع القادم."],
 ["I'll help you.","سأساعدك."],
 ["Look at the clouds. It is going to rain.","انظر إلى الغيوم. ستمطر."]
],type:"futuremix"},

{id:"A2U10",level:"A2",n:10,title:"Present Continuous for Future",desc:"استخدام المضارع المستمر للترتيبات المستقبلية.",rule:"am/is/are + verb-ing يمكن أن يستخدم لشيء مرتب مسبقاً في المستقبل.",examples:[
 ["I am meeting Ali tomorrow.","سألتقي بعلي غداً."],
 ["We are traveling on Friday.","سنسافر يوم الجمعة."],
 ["She is working tonight.","ستعمل الليلة."]

/* =========================================================
   REVIEW QUESTION GENERATORS
========================================================= */

function reviewQuestions(level){
 if(level==="A1"){
  return [
   ["I ___ from Iraq.","am","is","are","am","I + am."],
   ["She ___ English every day.","study","studies","studying","studies","she + verb-s."],
   ["They ___ working now.","is","are","am","are","they + are."],
   ["He ___ to work yesterday.","go","went","goes","went","yesterday → past."],
   ["There ___ two cars.","is","are","am","are","two cars = plural."],
   ["I am going to ___ tomorrow.","work","works","working","work","going to + base."]
  ];
 }
 return [
  ["I ___ working at 8 yesterday.","was","were","am","was","I + was."],
  ["She has ___ her work.","finish","finished","finishing","finished","has + participle."],
  ["I have lived here ___ 2020.","for","since","at","since","since + starting point."],
  ["I ___ him yesterday.","have seen","saw","see","saw","yesterday → past simple."],
  ["If I have time, I ___ call you.","will","would","am","will","First Conditional."],
  ["This car is ___ than mine.","fast","faster","fastest","faster","comparative."]
 ];
}

function getQuestions(unit){
 if(unit.type==="reviewA1")return reviewQuestions("A1");
 if(unit.type==="reviewA2")return reviewQuestions("A2");
 return (Q[unit.type]||[]).map((x,i)=>({
  id:unit.id+"_"+(i+1),
  text:x[0],
  options:[x[1],x[2],x[3]],
  answer:x[4],
  explanation:x[5]
 }));
}

function makeQuestions(unit){
 return getQuestions(unit).map((q,i)=>{
  if(!q.id){
   return {
    id:unit.id+"_"+(i+1),
    text:q[0],
    options:[q[1],q[2],q[3]],
    answer:q[4],
    explanation:q[5]
   };
  }
  return q;
 });
}

function totalMastery(){
 const total=units.length;

 return percent(done,total);
}

function updateStreak(){
 const today=new Date().toISOString().slice(0,10);
 if(state.lastDate===today)return;
 if(!state.lastDate){
  state.streak=1;
 }else{
  const old=new Date(state.lastDate);
  const now=new Date(today);
  const diff=Math.round((now-old)/86400000);
  state.streak=diff===1?state.streak+1:1;
 }
 state.lastDate=today;
}

/* =========================================================

========================================================= */

function startUnitQuiz(unitId){
 const u=findUnit(unitId);
 if(!u)return;

 quiz={
  mode:"unit",
  unitId:unitId,
  level:u.level,
  questions:shuffle(makeQuestions(u)),
  index:0,
  score:0,
  answered:false
 };

 renderQuiz();
 showPage("quiz");
}

function startWrongQuiz(){
 const ids=Object.keys(state.wrong);

 if(!ids.length){
  alert("لا توجد أسئلة أخطأت بها حالياً.");
  return;
 }

 const questions=[];

 ids.forEach(id=>{
  const item=state.wrong[id];
  if(item && item.question){
   questions.push(item.question);
  }
 });

 quiz={
  mode:"wrong",
  unitId:null,
  level:null,
  questions:shuffle(questions),
  index:0,
  score:0,
  answered:false
 };

 renderQuiz();
 showPage("quiz");
}

function startExam(level){
 let pool=[];

 if(level==="A1"){
  pool=units.filter(u=>u.level==="A1");
 }else if(level==="A2"){
  pool=units.filter(u=>u.level==="A2");
 }else{
  pool=units;
 }

 let qs=[];
 pool.forEach(u=>{
  makeQuestions(u).forEach(q=>qs.push(q));
 });

 quiz={
  mode:"exam",
  unitId:null,
  level:level,
  questions:shuffle(qs).slice(0,30),
  index:0,
  score:0,
  answered:false
 };

 renderQuiz();
 showPage("quiz");
}

function renderQuiz(){
 const q=quiz.questions[quiz.index];

 if(!q){
  finishQuiz();
  return;
 }

 quiz.answered=false;

 const letters=["A","B","C"];

 document.getElementById("quiz").innerHTML=`
 <div class="card">
  <div class="row" style="justify-content:space-between">
   <span class="badge">
    ${quiz.mode==="unit"?"اختبار الوحدة":quiz.mode==="wrong"?"مراجعة الأخطاء":"اختبار نهائي "+quiz.level}
   </span>
   <span class="small">
    سؤال ${quiz.index+1} من ${quiz.questions.length}
   </span>
  </div>

  <br>

  <div class="progress">
   <div style="width:${percent(quiz.index,quiz.questions.length)}%"></div>
  </div>

  <br>

  <div class="question">${q.text}</div>

  <div id="choices">
   ${q.options.map((o,i)=>`
    <button class="choice" id="choice${i}"
      onclick="answerQuiz(${i})">
      <b>${letters[i]}.</b> ${o}
    </button>
   `).join("")}
  </div>

  <div id="feedback"></div>

  <div id="nextArea" class="hidden" style="margin-top:12px">
   <button class="btn" onclick="nextQuestion()">
    ${quiz.index===quiz.questions.length-1?"عرض النتيجة":"السؤال التالي →"}
   </button>
  </div>

  <br>
  <button class="btn secondary" onclick="showUnits()">إنهاء الاختبار</button>
 </div>
 `;
}

function answerQuiz(index){
 if(quiz.answered)return;

 const q=quiz.questions[quiz.index];
 if(!q)return;

 quiz.answered=true;

 const chosen=q.options[index];
 const correct=chosen===q.answer;

 document.querySelectorAll(".choice").forEach((b,i)=>{
  b.disabled=true;
  if(q.options[i]===q.answer)b.classList.add("correct");
 });

 const selected=document.getElementById("choice"+index);
 if(!correct && selected)selected.classList.add("wrong");

 state.answered++;
 updateStreak();

 if(correct){
  quiz.score++;
  state.correct++;
  state.xp+=10;

  if(quiz.mode==="wrong"){
   removeWrong(q);
  }

  document.getElementById("feedback").innerHTML=`
   <div class="feedback good">
    <b>✅ إجابة صحيحة!</b><br>
    ${q.explanation}
   </div>`;
 }else{
  state.xp=Math.max(0,state.xp);
  saveWrong(q);

  document.getElementById("feedback").innerHTML=`
   <div class="feedback bad">
    <b>❌ إجابة غير صحيحة</b><br>
    الإجابة الصحيحة: <b>${q.answer}</b><br>
    ${q.explanation}
   </div>`;
 }

 saveState();

 document.getElementById("nextArea").classList.remove("hidden");
}

function nextQuestion(){
 quiz.index++;
 renderQuiz();
}

function finishQuiz(){
 const total=quiz.questions.length;
 const score=quiz.score;
 const pct=percent(score,total);

 if(quiz.mode==="unit" && quiz.unitId){
  const old=state.unitBest[quiz.unitId]||0;

  if(pct>old)state.unitBest[quiz.unitId]=pct;

  if(pct>=80){
   state.completedUnits[quiz.unitId]=true;
  }

  saveState();

  document.getElementById("quiz").innerHTML=`
   <div class="card">
    <h2>🎉 انتهى اختبار الوحدة</h2>
    <div class="statgrid">
     <div class="stat"><b>${score}</b><span>صحيح</span></div>
     <div class="stat"><b>${total-score}</b><span>خطأ</span></div>
     <div class="stat"><b>${pct}%</b><span>النتيجة</span></div>
    </div>
    <br>
    <p>${pct>=80?"ممتاز! تم تسجيل الوحدة كمكتملة.":"أعد الاختبار وحاول الوصول إلى 80% أو أكثر لإتقان الوحدة."}</p>
    <div class="row">
     <button class="btn" onclick="startUnitQuiz('${quiz.unitId}')">إعادة الاختبار</button>
     <button class="btn secondary" onclick="openLesson('${quiz.unitId}')">الدرس</button>
     <button class="btn secondary" onclick="showUnits()">الوحدات</button>
    </div>
   </div>`;
  return;
 }

 if(quiz.mode==="wrong"){
  saveState();

  document.getElementById("quiz").innerHTML=`
   <div class="card">
    <h2>🔁 انتهت مراجعة الأخطاء</h2>
    <div class="statgrid">
     <div class="stat"><b>${score}</b><span>صحيح</span></div>
     <div class="stat"><b>${total-score}</b><span>خطأ</span></div>
     <div class="stat"><b>${pct}%</b><span>النتيجة</span></div>
    </div>
    <br>
    <p>عدد الأسئلة المتبقية في بنك الأخطاء: <b>${Object.keys(state.wrong).length}</b></p>
    <div class="row">
     ${Object.keys(state.wrong).length?'<button class="btn" onclick="startWrongQuiz()">إعادة الأخطاء</button>':""}
     <button class="btn secondary" onclick="showHome()">الرئيسية</button>
    </div>
   </div>`;
  return;
 }

 if(quiz.mode==="exam"){
  state.examScores[quiz.level]=pct;
  saveState();

  document.getElementById("quiz").innerHTML=`
   <div class="card">
    <h2>🏆 انتهى الاختبار النهائي ${quiz.level}</h2>
    <div class="statgrid">

/* =========================================================
   SPEECH
========================================================= */

function speakText(text){
 try{
  if(!("speechSynthesis" in window)){
   alert("النطق الصوتي غير متوفر في هذا المتصفح.");
   return;
  }

  window.speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";
  u.rate=.82;
  u.pitch=1;

  window.speechSynthesis.speak(u);
 }catch(e){
  alert("تعذر تشغيل النطق الصوتي.");
 }
}

function startRecognition(){
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!Recognition){
  document.getElementById("speechResult").innerHTML=
   "⚠️ التعرف على الكلام غير مدعوم في هذا المتصفح. يمكنك استخدام زر 🔊 والاستمرار بالتدرب على النطق.";
  return;
 }

 try{
  const r=new Recognition();
  r.lang="en-US";
  r.interimResults=false;
  r.maxAlternatives=1;

  document.getElementById("speechResult").innerHTML="🎤 استمع... تحدث الآن.";

  r.onresult=function(event){
   const text=event.results[0][0].transcript;
   document.getElementById("speechResult").innerHTML=
    "سمعت: <b>"+escapeHTML(text)+"</b><br>ممتاز، استمر بالتدرب.";
  };

  r.onerror=function(){
   document.getElementById("speechResult").innerHTML=
    "⚠️ لم يتم التعرف على الكلام. حاول مرة أخرى أو استخدم زر النطق.";
  };

  r.start();
 }catch(e){
  document.getElementById("speechResult").innerHTML=
   "⚠️ تعذر تشغيل التعرف على الكلام.";
 }
}

/* =========================================================

========================================================= */

function exportProgress(){
 try{
  const data=JSON.stringify(state,null,2);
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download="Laith-English-Progress.json";
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(e){
  alert("تعذر تصدير التقدم.");
 }
}

function importProgress(){
 const input=document.createElement("input");
 input.type="file";
 input.accept=".json,application/json";

 input.onchange=function(){
  const file=input.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(){
   try{
    const imported=JSON.parse(reader.result);

    if(!imported || typeof imported!=="object"){
     throw new Error("invalid");
    }

    state=Object.assign(clone(defaultState),imported,{
     completedUnits:Object.assign({},imported.completedUnits||{}),
     unitBest:Object.assign({},imported.unitBest||{}),
     wrong:Object.assign({},imported.wrong||{}),
     vocabKnown:Object.assign({},defaultState.vocabKnown,imported.vocabKnown||{}),
     skillStats:Object.assign({},defaultState.skillStats,imported.skillStats||{}),
     examScores:Object.assign({},defaultState.examScores,imported.examScores||{})
    });

    saveState();
    renderHome();
    alert("تم استيراد التقدم بنجاح.");
   }catch(e){
    alert("ملف التقدم غير صالح.");
   }
  };

  reader.readAsText(file);
 };

 input.click();
}

/* =========================================================
   UTILITIES
========================================================= */

function shuffle(arr){
 const a=arr.slice();

 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }

 return a;
}

function escapeHTML(value){
 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

/* =========================================================
   SELF CHECK
========================================================= */

function selfCheck(){
 const errors=[];

 if(units.length!==42){
  errors.push("عدد الوحدات ليس 42.");
 }

 const a1=units.filter(u=>u.level==="A1").length;
 const a2=units.filter(u=>u.level==="A2").length;

 if(a1!==21)errors.push("A1 يجب أن يكون 21 وحدة.");
 if(a2!==21)errors.push("A2 يجب أن يكون 21 وحدة.");

 units.forEach(u=>{
  if(!u.id)errors.push("وحدة بدون ID.");
  if(!u.title)errors.push(u.id+" بدون عنوان.");
  if(!u.rule)errors.push(u.id+" بدون شرح.");
  if(!Q[u.type] && u.type!=="reviewA1" && u.type!=="reviewA2"){
   errors.push(u.id+" لا يوجد لها بنك أسئلة.");
  }

  const qs=makeQuestions(u);

  if(qs.length<5){
   errors.push(u.id+" لديها أقل من 5 أسئلة.");
  }

  qs.forEach(q=>{
   if(!q.id||!q.text||!q.answer){
    errors.push(u.id+" يحتوي سؤالاً ناقصاً.");
   }
  });
 });

 return errors;
}

   INITIALIZE
========================================================= */

function init(){
 const errors=selfCheck();

 if(errors.length){
  console.warn("Self check:",errors);
 }

 renderHome();
 showPage("home");
}
